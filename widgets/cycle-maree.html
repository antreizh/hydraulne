<body>
<!-- Widget servi depuis https://appli.antreizh.fr/widgets/ : toujours à jour sur le site -->
<!-- =====================================================================
     Widget « Cycle de marée » — Guily Glaz, Port-Launay (29)
     Hauteur d'eau mesurée depuis 0 h aujourd'hui, axe horaire sur 24 h.
     Taille auto-adaptative : le widget remplit la largeur et la hauteur du bloc.
     À coller dans un bloc « Code HTML » de WebAcappella (toute taille ; ≈ 340 × 330 px minimum conseillé).
     Indépendant des autres widgets : ils peuvent être sur la même page.
     Courbes superposées : Guily Glaz mesurée (trait plein) et Guily Glaz théorique (tirets), construite
     sur le profil réel des derniers cycles mesurés et les pleines mers SHOM de Brest.
     Sources : marégraphe de Guily Glaz (station J382183001) via Hub'Eau Hydrométrie ;
     coefficient et prédictions servant à la courbe théorique : SHOM (Brest, port de référence)
     ===================================================================== -->
<div id="mwc-widget">
  <div class="mwc-head">
    <span class="mwc-ico" aria-hidden="true">〰️</span>
    <div class="mwc-ttl">
      <div class="mwc-line1"><span class="mwc-t">Marée :</span> <span class="mwc-sub mwc-sub1" id="mwc-sub"><span>Guily Glaz · Port-Launay</span></span></div>
      <div class="mwc-info" id="mwc-info"><i class="mwc-wait"></i></div>
      <div class="mwc-sub" id="mwc-proch"></div>
    </div>
  </div>

  <div class="mwc-chart" id="mwc-chart" role="img" aria-label="Hauteur d'eau depuis minuit à Guily Glaz : courbe mesurée et courbe théorique">
    <svg id="mwc-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="mwc-tip" id="mwc-tip" hidden></div>
  </div>
  <div class="mwc-legend" id="mwc-legend" aria-label="Courbes affichées (toucher pour masquer ou afficher)"></div>

  <details class="mwc-table">
    <summary>Valeurs heure par heure</summary>
    <div id="mwc-rows"></div>
  </details>

  <div class="mwc-foot">
    <span class="mwc-time" id="mwc-time"></span>
    <span class="mwc-src">Sources : <a href="https://www.hydro.eaufrance.fr/stationhydro/J382183001/fiche" target="_blank" rel="noopener" title="L'Aulne à Port-Launay – Guily Glaz [marégraphe] – HydroPortail">HydroPortail</a> · <a href="https://maree.shom.fr/harbor/BREST" target="_blank" rel="noopener" title="Coefficient et prédictions de marée – SHOM, Brest">SHOM</a></span>
    <span class="mwc-copy">© <a href="https://www.antreizh.fr" target="_blank" rel="noopener" title="www.antreizh.fr">antreizh.fr</a></span>
    <span class="mwc-avert">Données et représentation indicatives non officielles</span>
  </div>
  <div id="mwc-shom-host" class="mwc-shom-host" aria-hidden="true"></div>
</div>

<style>
/* Toutes les tailles sont multipliées par --k, calculé selon la largeur allouée au widget */
#mwc-widget{
  --mwc-navy:#0b3c5d; --mwc-blue:#1f7bb6; --mwc-sky:#e8f4fb; --mwc-muted:#5f7180; --mwc-line:#e8edf1; --mwc-grid:#eef2f5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#1d2b36; background:#fff; border-radius:calc(18px*var(--k));
  padding:calc(14px*var(--k)) calc(14px*var(--k)) calc(10px*var(--k));
  box-shadow:0 2px calc(12px*var(--k)) rgba(11,60,93,.10); width:100%; --k:1; --kh:1;
  border:1px solid #d5dde4;                                             /* cadre gris très fin */
  box-sizing:border-box; line-height:1.3; position:relative;
  height:100%; display:flex; flex-direction:column; overflow:hidden;   /* remplit le bloc s'il a une hauteur fixe */
}
#mwc-widget > *{flex:0 0 auto}
#mwc-widget *,#mwc-widget *::before,#mwc-widget *::after{box-sizing:border-box}
#mwc-widget a{color:var(--mwc-muted);text-decoration:underline;text-underline-offset:2px}
#mwc-widget a:hover{color:var(--mwc-blue)}
/* Haut du widget : échelle propre --kh (suit la largeur du bloc) et tailles minimales garanties, pour rester lisible */
#mwc-widget .mwc-head{display:flex;flex-wrap:wrap;align-items:center;gap:calc(4px*var(--kh)) calc(10px*var(--kh));margin-bottom:calc(8px*var(--kh))}
#mwc-widget .mwc-ico{flex:0 0 calc(30px*var(--kh));height:calc(30px*var(--kh));border-radius:50%;background:#e1effa;display:inline-flex;align-items:center;justify-content:center;font-size:calc(15px*var(--kh))}
/* Titre « Cycle de marée », puis dessous, une taille de police en moins : « Coef. 30 · ↑ montante · −0,2 m »
   (coupure possible entre deux éléments seulement) */
#mwc-widget .mwc-ttl{flex:1 1 0;min-width:0}
#mwc-widget .mwc-line1{line-height:1.2;font-size:calc(16px*var(--kh));color:#0b3c5d}   /* = titre du mini-widget */

#mwc-widget .mwc-info{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:calc(6px*var(--kh));line-height:1.25;
  font-size:calc(16px*var(--kh));margin-top:calc(2px*var(--kh))}   /* = titre du mini-widget */
#mwc-widget .mwc-info:empty{display:none}
#mwc-widget .mwc-info > span{white-space:nowrap;color:var(--mwc-muted)}
/* séparateur « · » placé en fin d'élément : une ligne coupée ne commence jamais par un point */
#mwc-widget .mwc-info > span:not(:last-child)::after{content:" ·";color:var(--mwc-muted);font-weight:400}
#mwc-widget .mwc-h{font-weight:400;color:var(--mwc-navy)!important;font-variant-numeric:tabular-nums}   /* hauteur d'eau : pas en gras */
#mwc-widget .mwc-h .mwc-hh{font-size:.62em;font-weight:400;color:var(--mwc-muted)}
#mwc-widget .mwc-sub{font-size:calc(11.5px*var(--kh));color:var(--mwc-muted);margin-top:calc(2px*var(--kh))}
#mwc-widget .mwc-sub span{white-space:nowrap}
#mwc-widget .mwc-sub .mwc-proch{display:block;font-weight:600;color:#1d2b36}
/* « Marée : Guily Glaz · Port-Launay » : même taille, police et couleur que « Marée » */
#mwc-widget .mwc-sub1{display:inline;margin:0;font-size:1em;font-weight:700;color:inherit}
#mwc-widget .mwc-sub1 span{white-space:normal}

#mwc-widget .mwc-shom-host iframe{position:absolute;left:-10000px;top:0;width:420px;height:700px;border:0;visibility:hidden}

/* La courbe occupe tout l'espace restant ; sans hauteur imposée, elle garde un format 2:1 */
#mwc-widget .mwc-chart{position:relative;width:100%;flex:1 1 auto;aspect-ratio:2 / 1;min-height:calc(110px*var(--k))}
#mwc-widget .mwc-chart > svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;touch-action:pan-y}
#mwc-widget svg text{font-family:inherit;fill:var(--mwc-muted);font-variant-numeric:tabular-nums}
#mwc-widget .mwc-tip{position:absolute;top:0;transform:translateX(-50%);z-index:2;pointer-events:none;background:#fff;border:1px solid var(--mwc-line);
  border-radius:calc(8px*var(--k));padding:calc(4px*var(--k)) calc(8px*var(--k));font-size:calc(12px*var(--k));white-space:nowrap;
  box-shadow:0 2px 8px rgba(11,60,93,.12);color:#1d2b36}
#mwc-widget .mwc-tip b{font-variant-numeric:tabular-nums}
#mwc-widget .mwc-tip-l{display:flex;align-items:center;gap:calc(5px*var(--k));margin-top:calc(2px*var(--k))}
#mwc-widget .mwc-tip-l i{width:calc(8px*var(--k));height:calc(8px*var(--k));border-radius:50%;flex:0 0 auto}
#mwc-widget .mwc-tip-l b{margin-left:auto;padding-left:calc(8px*var(--k))}
/* Légende : une ligne par courbe (couleur + style de trait), touchable pour masquer / afficher */
#mwc-widget .mwc-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(2px*var(--k)) calc(16px*var(--k));margin-top:calc(6px*var(--k))}   /* légende centrée */
#mwc-widget .mwc-legend:empty{display:none}
#mwc-widget .mwc-legend button{display:inline-flex;align-items:center;gap:calc(5px*var(--k));border:0;background:none;padding:calc(2px*var(--k)) 0;
  font:inherit;font-size:calc(13.5px*var(--k));color:#1d2b36;cursor:pointer;white-space:nowrap}
#mwc-widget .mwc-legend button svg{width:calc(26px*var(--k));height:calc(9px*var(--k));flex:0 0 auto}
#mwc-widget .mwc-legend button[aria-pressed="false"]{color:var(--mwc-muted);text-decoration:line-through;opacity:.6}
#mwc-widget .mwc-legend button:disabled{display:none}
#mwc-widget .mwc-msg{font-size:calc(12.5px*var(--k));color:var(--mwc-muted);text-align:center;padding:calc(30px*var(--k)) 0}
#mwc-widget .mwc-table{margin-top:calc(4px*var(--k));font-size:calc(11.5px*var(--k));color:var(--mwc-muted)}
#mwc-widget .mwc-table summary{cursor:pointer;width:max-content}
#mwc-widget .mwc-table table{border-collapse:collapse;margin-top:calc(4px*var(--k));width:100%;font-variant-numeric:tabular-nums}
#mwc-widget .mwc-table td,#mwc-widget .mwc-table th{padding:calc(2px*var(--k)) calc(6px*var(--k));text-align:right;border-bottom:1px solid var(--mwc-grid);font-weight:400}
#mwc-widget .mwc-table th{text-align:left;color:#1d2b36}
#mwc-widget .mwc-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:calc(2px*var(--k)) calc(8px*var(--k));
  border-top:1px solid var(--mwc-line);margin-top:calc(6px*var(--k));padding-top:calc(7px*var(--k));font-size:calc(10.5px*var(--k));color:var(--mwc-muted)}
#mwc-widget .mwc-time{text-align:left;white-space:nowrap}
#mwc-widget .mwc-src{text-align:center;white-space:nowrap}
#mwc-widget .mwc-copy{text-align:right;white-space:nowrap}
/* Avertissement centré sous les sources */
#mwc-widget .mwc-avert{grid-column:1 / -1;text-align:center;font-style:italic}
/* Pied sur une seule ligne quand la largeur le permet : date · sources · mention · © antreizh.fr */
#mwc-widget .mwc-foot.mwc-foot-1{display:flex;justify-content:space-between;align-items:baseline;gap:calc(12px*var(--k))}
#mwc-widget .mwc-foot-1 > *{white-space:nowrap;text-align:left}
#mwc-widget .mwc-foot-1 .mwc-avert{order:3}
#mwc-widget .mwc-foot-1 .mwc-copy{order:4}
#mwc-widget .mwc-wait{display:inline-block;width:calc(60px*var(--k));height:calc(12px*var(--k));border-radius:calc(6px*var(--k));background:linear-gradient(90deg,#eef2f5,#dde5ec,#eef2f5);background-size:200% 100%;animation:mwc-sh 1.2s linear infinite}
@keyframes mwc-sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#mwc-widget *{animation:none!important}}
</style>

<script>
(function () {
  "use strict";

  /* ================== PARAMÈTRES (modifiables) ================== */
  var CFG = {
    station: "J382183001",          // L'Aulne à Port-Launay – Guily Glaz [marégraphe]
    refreshMinutes: 5,              // le marégraphe de Guily Glaz mesure toutes les 5 minutes
    trouMinutes: 20,                // au-delà de cet écart entre deux mesures, la courbe est interrompue
    shomPort: "BREST"               // port de référence SHOM (coefficient et prédictions)
  };
  /* ============================================================== */

  var root = document.getElementById("mwc-widget");
  if (!root || root.getAttribute("data-init")) return;
  root.setAttribute("data-init", "1");

  function $(id) { return document.getElementById(id); }
  function hm(d) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function m2(x) { return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function m1(x) { var r = Math.round(x * 10) / 10; return (r === 0 ? 0 : r).toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  var NS = "http://www.w3.org/2000/svg", MIN = 60000, HEURE = 3600e3, JOUR = 864e5;
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* ---- Les trois courbes : identité = couleur + style de trait (jamais la couleur seule) ---- */
  var SERIES = {
    mes:    { col: "#1f7bb6", dash: "",      lbl: "mesure" },
    theo:   { col: "#2e9e6a", dash: "5 3",   lbl: "théorique" }
  };
  var visible = { mes: true, theo: true };
  try { var mem = JSON.parse(localStorage.getItem("mwc-visible-v2") || "null"); if (mem) for (var c in visible) if (c in mem) visible[c] = !!mem[c]; } catch (e) {}

  /* ---- Taille auto-adaptative selon l'espace alloué au widget (largeur ET hauteur) ----
     1) le texte suit la largeur (340 px = taille de référence) ;
     2) si le bloc a une hauteur imposée, le texte suit aussi la hauteur (300 px = référence) : la plus
        petite des deux échelles est retenue, puis réduite si besoin jusqu'à ce que tout tienne ;
     3) la courbe occupe toute la place restante. */
  var k = 1, lastSize = "";
  function setK(v) { k = v; root.style.setProperty("--k", k.toFixed(3)); }
  var kh = 1;
  function setKh(v) { kh = v; root.style.setProperty("--kh", kh.toFixed(3)); }
  function fit() {                                      // (appelée aussi quand le contenu change)
    var w = root.clientWidth; if (!w) return;
    var hBloc = root.clientHeight;
    root.style.height = "auto"; var hNat = root.offsetHeight; root.style.height = "";
    var fixe = Math.abs(hBloc - hNat) > 2;
    // Haut du widget (titre, hauteur mesurée, coefficient) : suit la largeur du bloc, jamais plus petit
    // que la taille de référence, et limité à environ un tiers de la hauteur si celle-ci est imposée.
    // Haut du widget : même échelle que le mini-widget (340 px de large = taille de référence), pour des titres identiques
    setKh(Math.max(0.75, Math.min(2.2, w / 340)));
    // Reste du widget (courbe, légende, pied) : suit la largeur, et la hauteur si elle est imposée
    setK(Math.max(0.75, Math.min(2.2, fixe ? Math.min(w / 340, hBloc / 300) : w / 340)));
    // Si tout ne tient pas : on réduit d'abord le bas du widget, puis seulement le haut
    for (var i = 0; i < 12 && root.scrollHeight > root.clientHeight + 1 && k > 0.6; i++) setK(k * 0.92);
    for (i = 0; i < 6 && root.scrollHeight > root.clientHeight + 1 && kh > 0.85; i++) setKh(kh * 0.95);
    // Pied de widget : tout sur une ligne si la place le permet, sinon sur deux lignes (mention centrée dessous)
    var pied = root.querySelector(".mwc-foot");
    pied.classList.add("mwc-foot-1");
    if (pied.scrollWidth > pied.clientWidth + 1) pied.classList.remove("mwc-foot-1");
    lastSize = root.clientWidth + "x" + root.clientHeight;
    draw();
  }
  function onResize() { if (root.clientWidth + "x" + root.clientHeight !== lastSize) fit(); }

  /* ================== DONNÉES ================== */
  var jour0 = null;
  var pts = [], ptsFit = [];      // Guily Glaz : mesures du jour / mesures depuis la veille (pour l'ajustement)
  var tides = null;               // pleines et basses mers SHOM (Brest)
  var theo = null;                // ajustement { a, b, tau } de la courbe théorique de Guily Glaz
  var msgVide = "En attente des premières mesures du jour…";

  function getJSON(url) {
    return fetch(url, { headers: { Accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }

  /* 1) Marégraphe de Guily Glaz (Hub'Eau) : 4 derniers jours, pour établir le profil réel de la marée */
  function load() {
    var now = new Date();
    jour0 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    var debut = new Date(jour0.getTime() - 4 * JOUR);          // 4 jours : profil type de la marée à Guily Glaz
    getJSON("https://hubeau.eaufrance.fr/api/v2/hydrometrie/observations_tr?code_entite=" + encodeURIComponent(CFG.station) +
      "&grandeur_hydro=H&date_debut_obs=" + encodeURIComponent(debut.toISOString().slice(0, 19) + "Z") +
      "&size=5000&sort=asc&format=json")
      .then(function (j) {
        ptsFit = (j.data || []).filter(function (r) { return r.resultat_obs != null && r.date_obs; })
          .map(function (r) { return { t: new Date(r.date_obs), v: r.resultat_obs / 1000 }; })   // mm -> m
          .sort(function (a, b) { return a.t - b.t; });
        pts = ptsFit.filter(function (p) { return p.t >= jour0; });
        msgVide = "En attente des premières mesures du jour…";
        ajuster(); draw(); summary(); table();
      })
      .catch(function () {
        pts = []; ptsFit = []; theo = null;
        msgVide = "Mesures du marégraphe indisponibles pour le moment.";
        hauteurHTML = ""; sousTitre("données indisponibles");
        trendHTML = ""; renderState(); draw();
      });
  }

  /* 2) Vignette officielle SHOM (Brest) : coefficient + pleines/basses mers pour la courbe théorique */
  function loadShom() {
    var host = $("mwc-shom-host"); host.innerHTML = "";
    var f = document.createElement("iframe"), done = false, tries = 0;
    f.title = "Marées SHOM"; f.tabIndex = -1;
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body>' +
      '<script src="https://services.data.shom.fr/hdm/vignette/grande/' + encodeURIComponent(CFG.shomPort) + '?locale=fr"><\/script></body></html>';
    function attempt() {
      if (done) return;
      var ev = []; try { ev = parseShom(f.contentDocument); } catch (e) {}
      if (ev.length >= 2) { done = true; tides = ev; ajuster(); renderState(); table(); draw(); sousTitre(); }
      else if (++tries > 24) { done = true; renderState(); }
      else setTimeout(attempt, 500);
    }
    f.onload = attempt; host.appendChild(f); setTimeout(attempt, 1500);
  }

  var MOIS = { janvier: 0, "février": 1, fevrier: 1, mars: 2, avril: 3, mai: 4, juin: 5, juillet: 6,
    "août": 7, aout: 7, septembre: 8, octobre: 9, novembre: 10, "décembre": 11, decembre: 11 };
  var DAY_RE = /(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})(?:er)?\s+([a-zéû]+)\s+(\d{4})/i;
  // Les jours suivants de la vignette SHOM sont notés « 20/10/2026 » (et non « Mardi 20 octobre 2026 »)
  var DMY_RE = /(?:^|[^\d\/])(\d{1,2})\/(\d{1,2})\/(\d{4})(?![\d\/])/;

  function docsOf(doc) {
    var out = [doc], fr = doc.querySelectorAll("iframe");
    for (var i = 0; i < fr.length; i++) {
      try { var d = fr[i].contentDocument; if (d && d !== doc) out = out.concat(docsOf(d)); } catch (e) {}
    }
    return out;
  }
  function parseShom(rootDoc) {
    var ev = [], seen = {};
    docsOf(rootDoc).forEach(function (doc) {
      if (!doc || !doc.body) return;
      var cur = null, els = doc.body.querySelectorAll("*");
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
        if (el.tagName === "TR") {
          var type = null, time = null, h = null, coef = null, cells = el.querySelectorAll("td,th");
          for (var c = 0; c < cells.length; c++) {
            var t = cells[c].textContent.replace(/\s+/g, " ").trim();
            if (/^(PM|BM)$/.test(t)) type = t;
            else if (/^\d{1,2}[:h]\d{2}$/.test(t)) time = t;
            else if (/^-?\d+[.,]\d+(\s?m)?$/.test(t)) h = parseFloat(t.replace(",", "."));
            else if (/^\d{2,3}$/.test(t)) coef = +t;
          }
          if (type && time && cur) {
            var p = time.split(/[:h]/), d = new Date(cur.y, cur.m, cur.d, +p[0], +p[1]), k = type + d.getTime();
            if (!seen[k]) { seen[k] = 1; ev.push({ type: type, date: d, h: h, coef: type === "PM" ? coef : null }); }
            continue;
          }
        }
        var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (txt.length > 60) continue;
        var m = DAY_RE.exec(txt);
        if (m && MOIS[m[3].toLowerCase()] != null) cur = { y: +m[4], m: MOIS[m[3].toLowerCase()], d: +m[2] };
        else if ((m = DMY_RE.exec(txt))) cur = { y: +m[3], m: +m[2] - 1, d: +m[1] };
      }
    });
    ev.sort(function (a, b) { return a.date - b.date; });
    var out = [];                                   // une seule occurrence par marée
    ev.forEach(function (e) {
      var pr = out[out.length - 1];
      if (pr) { var dh = (e.date - pr.date) / 3600e3; if (dh < 3 || (e.type === pr.type && dh < 9)) return; }
      out.push(e);
    });
    return out;
  }
  function choisirCoef(ev, now) {
    var pm = null, jour = now.toDateString();
    ev.forEach(function (e) {
      if (e.type === "PM" && e.coef != null && e.date.toDateString() === jour &&
          (!pm || Math.abs(e.date - now) < Math.abs(pm.date - now))) pm = e;
    });
    if (!pm) for (var i = 0; i < ev.length; i++) if (ev[i].type === "PM" && ev[i].coef != null && ev[i].date > now) { pm = ev[i]; break; }
    return pm;
  }

  /* ================== DESSIN ================== */

    if (!W || !H) return;

    // ordre de superposition : théorique, puis la mesure de Guily Glaz au premier plan
    if (data.theo.length) trace(data.theo, SERIES.theo, false, 9999);
    if (data.mes.length) trace(data.mes, SERIES.mes, true, CFG.trouMinutes);

    // repère « maintenant » : à droite, la courbe théorique est extrapolée
    var now = new Date(), xn = X(now), tn = null;
    if (xn >= x0 && xn <= x1) {
      el("line", { x1: xn, x2: xn, y1: fs * 1.2, y2: y0, stroke: "#9aa9b5", "stroke-width": 1, "stroke-dasharray": (3 * k) + " " + (3 * k) }, svg);
      tn = el("text", { x: xn, y: fsE * 0.95, "text-anchor": xn > x1 - 70 * k ? "end" : xn < x0 + 70 * k ? "start" : "middle", "font-size": fsE }, svg);
      tn.textContent = "maintenant";
    }

    // plus haut / plus bas mesurés à Guily Glaz (étiquettes sélectives, sans chevauchement)
    function chevauche(a, c) {
      if (!a || !c) return false;
      var r1 = a.getBBox(), r2 = c.getBBox();
      return r1.x < r2.x + r2.width && r2.x < r1.x + r1.width && r1.y < r2.y + r2.height && r2.y < r1.y + r1.height;
    }
    if (data.mes.length >= 6) {
      var pmax = pts[0], pmin = pts[0], etiquettes = [];
      pts.forEach(function (p) { if (p.v > pmax.v) pmax = p; if (p.v < pmin.v) pmin = p; });
      if (pmax.v - pmin.v >= 0.05) [[pmax, -1], [pmin, 1]].forEach(function (a) {
        var p = a[0], sens = a[1], px = X(p.t), py = Y(p.v);
        el("circle", { cx: px, cy: py, r: 3 * k, fill: SERIES.mes.col, stroke: "#fff", "stroke-width": 2 }, svg);
        var anchor = px < x0 + 70 * k ? "start" : px > x1 - 70 * k ? "end" : "middle";
        var lb = el("text", { "text-anchor": anchor, "font-size": fsE }, svg);
        // couleur de la courbe mesurée, sans gras ni liseré : lisible sur fond clair comme sur fond sombre
        lb.style.fill = SERIES.mes.col; lb.style.fontWeight = "400";
        lb.textContent = m2(p.v) + " m · " + hm(p.t);
        // positions essayées :
        //  - pleine mer : à droite puis à gauche du sommet, à la même hauteur (la courbe redescend de part et d'autre),
        //    puis au-dessus, puis au-dessous ;
        //  - basse mer : au-dessous (centrée, puis décalée), puis au-dessus vers la droite (palier de basse mer).
        var yA = py - fsE * 0.6 - 3 * k, yB = py + fsE * 1.1 + 3 * k, yM = py - fsE * 0.2, essais;   // yM : un peu au-dessus du sommet
        if (sens < 0) essais = [[px + 9 * k, yM, "start"], [px - 9 * k, yM, "end"], [px, yA, anchor], [px, yB, anchor]];
        else essais = [[px, yB, anchor], [px + 6 * k, yB, "end"], [px - 6 * k, yB, "start"], [px - 6 * k, yA, "start"], [px + 6 * k, yA, "end"]];
        var ys = [essais[0][1]];
        for (var i = 0; i < essais.length; i++) {
          lb.setAttribute("x", essais[i][0]); lb.setAttribute("y", essais[i][1]); lb.setAttribute("text-anchor", essais[i][2]);
          var bb = lb.getBBox();
          if (bb.y >= 0 && bb.y + bb.height <= y0 && bb.x >= 0 && bb.x + bb.width <= W && !chevauche(lb, tn) &&
              !etiquettes.some(function (e) { return chevauche(lb, e); })) break;
          if (i === essais.length - 1) { lb.setAttribute("x", essais[0][0]); lb.setAttribute("y", essais[0][1]); lb.setAttribute("text-anchor", essais[0][2]); }   // à défaut : position principale
        }
        if (lb.parentNode) etiquettes.push(lb);
      });
      var last = pts[pts.length - 1];
      el("circle", { cx: X(last.t), cy: Y(last.v), r: 4.5 * k, fill: "#0b3c5d", stroke: "#fff", "stroke-width": 2 }, svg);
    }

    // survol / toucher : réticule + infobulle avec les valeurs des courbes affichées
    var hair = el("line", { x1: 0, x2: 0, y1: y1, y2: y0, stroke: "#0b3c5d", "stroke-width": 1, opacity: 0 }, svg);
    var dots = {};
    Object.keys(SERIES).forEach(function (key) {
      dots[key] = el("circle", { r: 4 * k, fill: SERIES[key].col, stroke: "#fff", "stroke-width": 2, opacity: 0 }, svg);
    });
    var hit = el("rect", { x: x0, y: 0, width: x1 - x0, height: H, fill: "transparent" }, svg);
    var tip = $("mwc-tip");
    function proche(serie, t, tol) {
      var best = null;
      serie.forEach(function (p) { var d = Math.abs(p.t - t); if (d <= tol && (!best || d < best.d)) best = { p: p, d: d }; });
      return best ? best.p : null;
    }
    function show(ev) {
      var r = svg.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var sx = Math.max(x0, Math.min(x1, cx * W / r.width));
      var t = new Date(jour0.getTime() + (sx - x0) / (x1 - x0) * JOUR);
      var lignes = [], topY = Infinity;
      var vals = {
        mes: data.mes.length ? proche(data.mes, t, 8 * MIN) : null,
        theo: data.theo.length ? proche(data.theo, t, 3 * MIN) : null
      };
      var tRef = vals.mes ? vals.mes.t : t;
      Object.keys(SERIES).forEach(function (key) {
        var p = vals[key], dot = dots[key];
        if (!p) { dot.setAttribute("opacity", 0); return; }
        var py = Y(p.v); topY = Math.min(topY, py);
        dot.setAttribute("cx", X(p.t)); dot.setAttribute("cy", py); dot.setAttribute("opacity", 1);
        lignes.push('<span class="mwc-tip-l"><i style="background:' + SERIES[key].col + '"></i>' +
          SERIES[key].lbl.replace("Guily Glaz ", "") + " <b>" + m2(p.v) + " m</b></span>");
      });
      if (!lignes.length) { hide(); return; }
      var px = X(tRef);
      hair.setAttribute("x1", px); hair.setAttribute("x2", px); hair.setAttribute("opacity", 0.35);
      tip.innerHTML = "<b>" + hm(tRef) + "</b>" + lignes.join("");
      tip.hidden = false;
      var left = px * r.width / W, half = tip.offsetWidth / 2, top = topY * r.height / H - tip.offsetHeight - 10 * k;
      tip.style.left = Math.max(half, Math.min(r.width - half, left)) + "px";
      tip.style.top = Math.max(0, top) + "px";
    }
    function hide() {
      hair.setAttribute("opacity", 0); tip.hidden = true;
      Object.keys(dots).forEach(function (key) { dots[key].setAttribute("opacity", 0); });
    }
    hit.addEventListener("mousemove", show); hit.addEventListener("mouseleave", hide);
    hit.addEventListener("touchstart", show, { passive: true }); hit.addEventListener("touchmove", show, { passive: true });
    hit.addEventListener("touchend", function () { setTimeout(hide, 1500); });
  }

  function tick() {
    var d = new Date();
    $("mwc-time").textContent = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " · " + hm(d);
    if (jour0 && d.toDateString() !== jour0.toDateString()) load();   // passage à minuit : nouvelle journée
    else draw();                                                       // fait avancer le repère « maintenant »
    renderState();                                                     // le coefficient suit la marée en cours
    sousTitre();                                                       // prochaine pleine / basse mer
  }

  tick(); load(); loadShom(); fit();
  if (window.ResizeObserver) {
    new ResizeObserver(onResize).observe(root);
    if (root.parentElement) new ResizeObserver(onResize).observe(root.parentElement);
  }
  window.addEventListener("resize", onResize);
  root.querySelector(".mwc-table").addEventListener("toggle", fit);   // tableau déplié : on recalcule la place
  setInterval(load, CFG.refreshMinutes * 60000);                       // mesures de Guily Glaz
  setInterval(loadShom, 60 * 60000);                                   // prédictions SHOM : une fois par heure
  setInterval(tick, 60000);
})();
</script>
<script>
  // Signale la hauteur du widget à la page qui l'affiche (site antreizh.fr ou appli), pour ajuster le cadre
  (function () {
    if (window.parent === window) return;
    var last = 0;
    function envoyer() {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ hydraulneHauteur: h }, "*"); }
    }
    if (window.ResizeObserver) new ResizeObserver(envoyer).observe(document.body);
    window.addEventListener("load", envoyer);
    setTimeout(envoyer, 500); setTimeout(envoyer, 2000); setTimeout(envoyer, 5000);
  })();
</script>
</body>
