<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget mini Marée · antreizh.fr</title>
<style>html,body{margin:0;background:transparent}body{padding:1px}</style>
</head>
<body>
<!-- Widget servi depuis https://appli.antreizh.fr/widgets/ : toujours à jour sur le site -->
<!-- =====================================================================
     Widget mini Marée — marée au Pont de Térénez : coefficient, tendance, prochaine marée.
     À coller dans un bloc « Code HTML » de WebAcappella (≈ 340 × 110 px).
     Indépendant des autres widgets : ils peuvent être sur la même page.
     Sources : SHOM (Brest, port de référence) + corrections du port rattaché
     ===================================================================== -->
<div id="mwt-widget">
  <div class="mwt-row">
    <span class="mwt-ico" style="background:#e1effa">⚓</span>
    <span class="mwt-l1">Marée</span>
    <span class="mwt-r1" id="mwt-tide"><i class="mwt-wait"></i></span>
    <span class="mwt-l2">Pont de Térénez <a class="mwt-zoom" href="https://www.antreizh.fr/mareeguilyglas.html" target="_blank" rel="noopener" title="Marée à Guily Glaz : courbe détaillée">zoom</a></span>
    <span class="mwt-r2" id="mwt-next"></span>
  </div>

  <div class="mwt-foot" id="mwt-foot">
    <span class="mwt-time" id="mwt-time"></span>
    <span id="mwt-sources">Sources : <a href="https://maree.shom.fr/harbor/BREST" target="_blank" rel="noopener" title="Marées SHOM – Brest, port de référence du Pont de Térénez">SHOM</a></span>
    <span class="mwt-copy">© <a href="https://www.antreizh.fr" target="_blank" rel="noopener" title="www.antreizh.fr">antreizh.fr</a></span>
  </div>
  <div id="mwt-shom-host" class="mwt-shom-host"></div>
</div>

<style>
/* Toutes les tailles sont multipliées par --k, calculé selon la largeur allouée au widget */
#mwt-widget{
  --mwt-navy:#0b3c5d; --mwt-muted:#5f7180; --mwt-line:#e8edf1;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#1d2b36; background:#fff; border-radius:calc(18px*var(--k)); padding:calc(14px*var(--k)) calc(14px*var(--k)) calc(10px*var(--k));
  box-shadow:0 2px calc(12px*var(--k)) rgba(11,60,93,.10); width:100%; --k:1;
  border:1px solid #d5dde4;                                             /* cadre gris très fin */
  box-sizing:border-box; line-height:1.3;
}
#mwt-widget *,#mwt-widget *::before,#mwt-widget *::after{box-sizing:border-box}
#mwt-widget a{color:#1f7bb6}
#mwt-widget .mwt-time{text-align:left;white-space:nowrap}
/* Rangée marée sur 2 lignes : « Marée » et « Coef. … » sur la même ligne, puis le lieu et la prochaine marée */
#mwt-widget .mwt-row{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;column-gap:calc(10px*var(--k));row-gap:calc(2px*var(--k));padding:0 0 calc(9px*var(--k))}
#mwt-widget .mwt-ico{grid-row:1 / 3;align-self:center;width:calc(30px*var(--k));height:calc(30px*var(--k));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:calc(15px*var(--k))}
#mwt-widget .mwt-l1{font-size:calc(13.5px*var(--k));font-weight:600;white-space:nowrap}
#mwt-widget .mwt-r1{font-size:calc(12px*var(--k));text-align:right;white-space:nowrap}
#mwt-widget .mwt-l2,#mwt-widget .mwt-r2{font-size:calc(11.5px*var(--k));color:var(--mwt-muted);white-space:nowrap}
#mwt-widget .mwt-r2{text-align:right}
#mwt-widget .mwt-zoom{font-size:calc(10px*var(--k));margin-left:calc(4px*var(--k));color:#1f7bb6;text-decoration:underline;text-underline-offset:2px}
#mwt-widget .mwt-coef{font-weight:800;color:var(--mwt-navy)}
#mwt-widget .mwt-vague{width:calc(16px*var(--k));height:calc(9px*var(--k));vertical-align:middle;margin:0 calc(2px*var(--k)) calc(2px*var(--k)) calc(3px*var(--k));overflow:visible}
#mwt-widget .mwt-up{color:#1f7bb6;font-weight:700}
#mwt-widget .mwt-down{color:#c56a1c;font-weight:700}
#mwt-widget .mwt-na{color:var(--mwt-muted);font-size:calc(12px*var(--k))}
#mwt-widget .mwt-foot{border-top:1px solid var(--mwt-line);padding-top:calc(3px*var(--k));font-size:calc(10.5px*var(--k));color:var(--mwt-muted)}
#mwt-widget .mwt-foot a{color:var(--mwt-muted);text-decoration:underline;text-underline-offset:2px}
#mwt-widget .mwt-foot a:hover{color:#1f7bb6}
#mwt-widget .mwt-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:calc(2px*var(--k)) calc(8px*var(--k))}
#mwt-widget #mwt-sources{text-align:center;white-space:nowrap}
#mwt-widget .mwt-foot .mwt-copy{text-align:right;white-space:nowrap}
#mwt-widget .mwt-wait{display:inline-block;width:calc(46px*var(--k));height:calc(10px*var(--k));border-radius:calc(6px*var(--k));background:linear-gradient(90deg,#eef2f5,#dde5ec,#eef2f5);background-size:200% 100%;animation:mwt-sh 1.2s linear infinite}
#mwt-widget .mwt-shom-host iframe{position:absolute;left:-10000px;top:0;width:420px;height:700px;border:0;visibility:hidden}
@keyframes mwt-sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#mwt-widget *{animation:none!important}}

</style>

<script>
(function () {
  "use strict";

  /* ================== PARAMÈTRES (modifiables) ================== */
  var CFG = {
    shomPort: "BREST",
    portRattache: {                      // Pont de Térénez, rattaché à Brest (null = Brest)
      pm: { ve: { dt: 5,  dh: 0.40 }, me: { dt: 5, dh: 0.35 } },
      bm: { ve: { dt: 10, dh: 0.15 }, me: { dt: 5, dh: 0.20 } }
    },
    lienDetail: "",                      // ex. "/eau.html" : ajoute un lien « Voir le détail »
    refreshMinutes: 30
  };
  /* ============================================================== */

  var root = document.getElementById("mwt-widget");
  if (!root || root.getAttribute("data-init")) return;
  root.setAttribute("data-init", "1");

  /* ---- Taille de police auto-adaptative : selon la largeur réellement allouée au widget ---- */
  function fit() {
    var w = root.clientWidth; if (!w) return;
    var k = Math.max(0.75, Math.min(2.2, w / 340));                 // 340 px de large = taille de référence
    root.style.setProperty("--k", k.toFixed(3));
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
  window.addEventListener("resize", fit);

  function $(id) { return document.getElementById(id); }
  function hm(d) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function na(id) { $(id).innerHTML = '<span class="mwt-na">indisponible</span>'; }

  /* ---------------- Marée ---------------- */
  var MOIS = { janvier: 0, "février": 1, fevrier: 1, mars: 2, avril: 3, mai: 4, juin: 5, juillet: 6,
    "août": 7, aout: 7, septembre: 8, octobre: 9, novembre: 10, "décembre": 11, decembre: 11 };
  var DAY_RE = /(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})(?:er)?\s+([a-zéû]+)\s+(\d{4})/i;
  // Les jours suivants de la vignette SHOM sont notés « 20/10/2026 » (et non « Mardi 20 octobre 2026 »)
  var DMY_RE = /(?:^|[^\d\/])(\d{1,2})\/(\d{1,2})\/(\d{4})(?![\d\/])/;
  var tides = null;

  function docsOf(doc) {
    var out = [doc], fr = doc.querySelectorAll("iframe");
    for (var i = 0; i < fr.length; i++) {
      try { var d = fr[i].contentDocument; if (d && d !== doc) out = out.concat(docsOf(d)); } catch (e) {}
    }
    return out;
  }
  function parseShom(rootDoc) {
    var ev = [], seen = {};
    docsOf(rootDoc).forEach(function (doc) {
      if (!doc || !doc.body) return;
      var cur = null, els = doc.body.querySelectorAll("*");
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
        if (el.tagName === "TR") {
          var type = null, time = null, h = null, coef = null, cells = el.querySelectorAll("td,th");
          for (var c = 0; c < cells.length; c++) {
            var t = cells[c].textContent.replace(/\s+/g, " ").trim();
            if (/^(PM|BM)$/.test(t)) type = t;
            else if (/^\d{1,2}[:h]\d{2}$/.test(t)) time = t;
            else if (/^-?\d+[.,]\d+(\s?m)?$/.test(t)) h = parseFloat(t.replace(",", "."));
            else if (/^\d{2,3}$/.test(t)) coef = +t;
          }
          if (type && time && cur) {
            var p = time.split(/[:h]/), d = new Date(cur.y, cur.m, cur.d, +p[0], +p[1]), k = type + d.getTime();
            if (!seen[k]) { seen[k] = 1; ev.push({ type: type, date: d, h: h, coef: type === "PM" ? coef : null }); }
            continue;
          }
        }
        var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (txt.length > 60) continue;
        var m = DAY_RE.exec(txt);
        if (m && MOIS[m[3].toLowerCase()] != null) cur = { y: +m[4], m: MOIS[m[3].toLowerCase()], d: +m[2] };
        else if ((m = DMY_RE.exec(txt))) cur = { y: +m[3], m: +m[2] - 1, d: +m[1] };
      }
    });
    ev.sort(function (a, b) { return a.date - b.date; });
    var out = [];                                   // une seule occurrence par marée
    ev.forEach(function (e) {
      var pr = out[out.length - 1];
      if (pr) { var dh = (e.date - pr.date) / 3600e3; if (dh < 3 || (e.type === pr.type && dh < 9)) return; }
      out.push(e);
    });
    return out;
  }
  function corrige(ev) {
    var pr = CFG.portRattache; if (!pr) return ev;
    return ev.map(function (e) {
      var coef = e.coef;
      if (coef == null) ev.forEach(function (x) {
        if (x.type === "PM" && x.coef != null && (coef == null || Math.abs(x.date - e.date) < Math.abs(e._b - e.date))) { coef = x.coef; e._b = x.date; }
      });
      var c = pr[e.type === "PM" ? "pm" : "bm"], f = Math.max(0, Math.min(1, ((coef == null ? 70 : coef) - 45) / 50));
      return { type: e.type, coef: e.coef,
        date: new Date(e.date.getTime() + Math.round(c.me.dt + (c.ve.dt - c.me.dt) * f) * 60000),
        h: e.h != null ? e.h + c.me.dh + (c.ve.dh - c.me.dh) * f : null };
    });
  }
  // Règle « jour J d'abord » : coefficient = pleine mer du jour la plus proche de maintenant ;
  // si aucune n'est disponible aujourd'hui, celle de la prochaine pleine mer (lendemain).
  function choisirCoef(ev, now) {
    var pm = null, jour = now.toDateString();
    ev.forEach(function (e) {
      if (e.type === "PM" && e.coef != null && e.date.toDateString() === jour &&
          (!pm || Math.abs(e.date - now) < Math.abs(pm.date - now))) pm = e;
    });
    if (!pm) for (var i = 0; i < ev.length; i++) if (ev[i].type === "PM" && ev[i].coef != null && ev[i].date > now) { pm = ev[i]; break; }
    return pm;
  }
  function estDemain(d, now) {
    return d.toDateString() === new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toDateString();
  }
  // Mini symbole « vague et point » : position dans le cycle basse mer (0) → pleine mer (0,5) → basse mer (1)
  function phaseMaree(prev, next, now) {
    if (!prev) return next.type === "PM" ? 0.25 : 0.75;
    var f = Math.max(0, Math.min(1, (now - prev.date) / (next.date - prev.date)));
    return prev.type === "BM" ? f / 2 : 0.5 + f / 2;
  }
  function vague(ph, col, cls) {
    var w = 22, h = 12, a = h / 2 - 1.5, pts = [];
    for (var i = 0; i <= 22; i++) { var x = i / 22; pts.push((x * w).toFixed(1) + "," + (h / 2 + a * Math.cos(2 * Math.PI * x)).toFixed(1)); }
    var cx = ph * w, cy = h / 2 + a * Math.cos(2 * Math.PI * ph);
    return '<svg class="' + cls + '" viewBox="-1.5 -1.5 ' + (w + 3) + " " + (h + 3) + '" aria-hidden="true">' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#9cb8cc" stroke-width="1.4"/>' +
      '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="2.6" fill="' + col + '" stroke="#fff" stroke-width="1"/></svg>';
  }
  function renderTide() {
    if (!tides) return;
    var now = new Date(), prev = null, next = null;
    for (var i = 0; i < tides.length; i++) { if (tides[i].date <= now) prev = tides[i]; else { next = tides[i]; break; } }
    var pm = choisirCoef(tides, now);                // jour J d'abord, sinon lendemain
    if (!next) return na("mwt-tide");
    var rising = prev ? prev.type === "BM" : next.type === "PM";
    $("mwt-tide").innerHTML =
      (pm ? '<span class="mwt-coef">Coef. ' + pm.coef + (estDemain(pm.date, now) ? " (J+1)" : "") + "</span>" : "") +
      '<span title="' + (prev ? (prev.type === "PM" ? "Pleine mer " : "Basse mer ") + hm(prev.date) + " → " : "") + (next.type === "PM" ? "pleine mer " : "basse mer ") + hm(next.date) + '" class="' + (rising ? "mwt-up" : "mwt-down") + '">' + vague(phaseMaree(prev, next, now), rising ? "#1f7bb6" : "#c56a1c", "mwt-vague") + (rising ? "Montante" : "Descendante") + "</span>";
    $("mwt-next").textContent = (next.type === "PM" ? "Pleine mer" : "Basse mer") + (estDemain(next.date, now) ? " demain " : " ") + hm(next.date);
  }
  function loadTide() {
    var host = $("mwt-shom-host"); host.innerHTML = "";
    var f = document.createElement("iframe"), done = false, tries = 0;
    f.title = "Marées SHOM";
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body>' +
      '<script src="https://services.data.shom.fr/hdm/vignette/grande/' + encodeURIComponent(CFG.shomPort) + '?locale=fr"><\/script></body></html>';
    function attempt() {
      if (done) return;
      var ev = []; try { ev = parseShom(f.contentDocument); } catch (e) {}
      if (ev.length >= 2) { done = true; tides = corrige(ev); renderTide(); }
      else if (++tries > 24) { done = true; $("mwt-tide").innerHTML = '<a href="https://maree.shom.fr/harbor/BREST" target="_blank" rel="noopener">voir le SHOM</a>'; }
      else setTimeout(attempt, 500);
    }
    f.onload = attempt; host.appendChild(f); setTimeout(attempt, 1500);
  }

  /* ---------------- Lancement ---------------- */
  if (CFG.lienDetail) {
    $("mwt-sources").innerHTML += ' · <a href="' + CFG.lienDetail + '">Voir le détail</a>';
  }
  function tick() { var d = new Date(); $("mwt-time").textContent = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " · " + hm(d); }
  function refreshAll() { loadTide(); }
  tick(); refreshAll();
  setInterval(refreshAll, CFG.refreshMinutes * 60000);
  setInterval(function () { tick(); renderTide(); }, 60000);
})();
</script>
<script>
  // Signale la hauteur du widget à la page qui l'affiche (site antreizh.fr ou appli), pour ajuster le cadre
  (function () {
    if (window.parent === window) return;
    var last = 0;
    function envoyer() {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ hydraulneHauteur: h }, "*"); }
    }
    if (window.ResizeObserver) new ResizeObserver(envoyer).observe(document.body);
    window.addEventListener("load", envoyer);
    setTimeout(envoyer, 500); setTimeout(envoyer, 2000); setTimeout(envoyer, 5000);
  })();
</script>
</body>
</html>
