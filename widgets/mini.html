<style>

</style>

<script>
(function () {
  "use strict";

  /* ================== PARAMÈTRES (modifiables) ================== */
  var CFG = {
    shomPort: "BREST",
    portRattache: {                      // Pont de Térénez, rattaché à Brest (null = Brest)
      pm: { ve: { dt: 5,  dh: 0.40 }, me: { dt: 5, dh: 0.35 } },
      bm: { ve: { dt: 10, dh: 0.15 }, me: { dt: 5, dh: 0.20 } }
    },
    vigieauInsee: "29026", vigieauLat: 48.1966, vigieauLon: -4.0903, vigieauProfil: "particulier",
    bss: "03103X0047/PZ",                // nappe de Saint-Ségal (Kergadalen)
    stationAulne: "J382182001",          // l'Aulne à Châteaulin – Pont routier
    fenetreJours: 10,
    lienDetail: "",                      // ex. "/eau.html" : ajoute un lien « Voir le détail »
    refreshMinutes: 30
  };
  /* ============================================================== */

  var root = document.getElementById("mwm-widget");
  if (!root || root.getAttribute("data-init")) return;
  root.setAttribute("data-init", "1");

  /* ---- Taille de police auto-adaptative : selon la largeur réellement allouée au widget ---- */
  function fit() {
    var w = root.clientWidth; if (!w) return;
    var k = Math.max(0.75, Math.min(2.2, w / 340));                 // 340 px de large = taille de référence
    root.style.setProperty("--k", k.toFixed(3));
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
  window.addEventListener("resize", fit);

  function $(id) { return document.getElementById(id); }
  function hm(d) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function num(x, n) { return x.toLocaleString("fr-FR", { minimumFractionDigits: n, maximumFractionDigits: n }); }
  function pill(txt, col, echelle) {
    return (echelle ? '<button type="button" class="mwm-info" data-echelle="' + echelle + '" aria-label="Échelle de situation" title="Échelle de situation">ⓘ</button>' : "") +
      '<span class="mwm-pill" style="background:' + col + '">' + txt + "</span>";
  }
  function na(id) { $(id).innerHTML = '<span class="mwm-na">indisponible</span>'; }
  function getJSON(url) {
    return fetch(url, { headers: { Accept: "application/json" } }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status); return r.json();
    });
  }
  // Rang du niveau actuel parmi les années passées, à la même période (0 = le plus bas, 1 = le plus haut)
  function rangSaison(hist, tRef, vNow, minPts) {
    var d = new Date(tRef), win = CFG.fenetreJours * 864e5, byYear = {};
    hist.forEach(function (r) {
      var yr = null;
      [r.y - 1, r.y, r.y + 1].forEach(function (y) {
        if (Math.abs(r.t - Date.UTC(y, d.getUTCMonth(), d.getUTCDate())) <= win) yr = y;
      });
      if (yr == null || yr === d.getUTCFullYear()) return;
      (byYear[yr] = byYear[yr] || []).push(r.v);
    });
    var refs = Object.keys(byYear).filter(function (y) { return byYear[y].length >= minPts; })
      .map(function (y) { var a = byYear[y]; return a.reduce(function (s, x) { return s + x; }, 0) / a.length; });
    if (refs.length < 5) return null;
    var below = 0, eq = 0;
    refs.forEach(function (x) { if (x < vNow) below++; else if (x === vNow) eq++; });
    return (below + eq / 2) / refs.length;
  }
  // Ligne « variation par rapport à J-7 » : flèche + valeur signée
  function varJ7(txt, signe, prefixe, cls) {
    var fl = signe > 0 ? "↗" : signe < 0 ? "↘" : "→";
    return '<small class="' + (cls || "mwm-var") + '"><span class="mwm-nw">' + (prefixe || "") + fl + " " + txt + " / J-7</span></small>";
  }
  // Mesure la plus récente à la date t ou juste avant (tolérance en jours)
  function mesureA(d, t, tolJours) {
    for (var i = d.length - 1; i >= 0; i--) if (d[i].t <= t) return t - d[i].t <= tolJours * 864e5 ? d[i] : null;
    return null;
  }
  // Date de la dernière mesure : « 25 oct. à 11:30 » (Aulne) ou « 24 oct. » (nappe : valeur journalière, sans heure)
  function jourCourt(d, utc) { return d.toLocaleDateString("fr-FR", utc ? { day: "numeric", month: "short", timeZone: "UTC" } : { day: "numeric", month: "short" }); }
  function signed(x, n, unit) { return (x > 0 ? "+" : x < 0 ? "−" : "±") + num(Math.abs(x), n) + unit; }
  function classe(list, p) { return list.filter(function (c) { return p < c.max; })[0] || list[list.length - 1]; }

  /* ---------------- 1) Marée ---------------- */
  var MOIS = { janvier: 0, "février": 1, fevrier: 1, mars: 2, avril: 3, mai: 4, juin: 5, juillet: 6,
    "août": 7, aout: 7, septembre: 8, octobre: 9, novembre: 10, "décembre": 11, decembre: 11 };
  var DAY_RE = /(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})(?:er)?\s+([a-zéû]+)\s+(\d{4})/i;
  // Les jours suivants de la vignette SHOM sont notés « 20/10/2026 » (et non « Mardi 20 octobre 2026 »)
  var DMY_RE = /(?:^|[^\d\/])(\d{1,2})\/(\d{1,2})\/(\d{4})(?![\d\/])/;
  var tides = null;

  function docsOf(doc) {
    var out = [doc], fr = doc.querySelectorAll("iframe");
    for (var i = 0; i < fr.length; i++) {
      try { var d = fr[i].contentDocument; if (d && d !== doc) out = out.concat(docsOf(d)); } catch (e) {}
    }
    return out;
  }
  function parseShom(rootDoc) {
    var ev = [], seen = {};
    docsOf(rootDoc).forEach(function (doc) {
      if (!doc || !doc.body) return;
      var cur = null, els = doc.body.querySelectorAll("*");
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.tagName === "SCRIPT" || el.tagName === "STYLE") continue;
        if (el.tagName === "TR") {
          var type = null, time = null, h = null, coef = null, cells = el.querySelectorAll("td,th");
          for (var c = 0; c < cells.length; c++) {
            var t = cells[c].textContent.replace(/\s+/g, " ").trim();
            if (/^(PM|BM)$/.test(t)) type = t;
            else if (/^\d{1,2}[:h]\d{2}$/.test(t)) time = t;
            else if (/^-?\d+[.,]\d+(\s?m)?$/.test(t)) h = parseFloat(t.replace(",", "."));
            else if (/^\d{2,3}$/.test(t)) coef = +t;
          }
          if (type && time && cur) {
            var p = time.split(/[:h]/), d = new Date(cur.y, cur.m, cur.d, +p[0], +p[1]), k = type + d.getTime();
            if (!seen[k]) { seen[k] = 1; ev.push({ type: type, date: d, h: h, coef: type === "PM" ? coef : null }); }
            continue;
          }
        }
        var txt = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (txt.length > 60) continue;
        var m = DAY_RE.exec(txt);
        if (m && MOIS[m[3].toLowerCase()] != null) cur = { y: +m[4], m: MOIS[m[3].toLowerCase()], d: +m[2] };
        else if ((m = DMY_RE.exec(txt))) cur = { y: +m[3], m: +m[2] - 1, d: +m[1] };
      }
    });
    ev.sort(function (a, b) { return a.date - b.date; });
    var out = [];                                   // une seule occurrence par marée
    ev.forEach(function (e) {
      var pr = out[out.length - 1];
      if (pr) { var dh = (e.date - pr.date) / 3600e3; if (dh < 3 || (e.type === pr.type && dh < 9)) return; }
      out.push(e);
    });
    return out;
  }
  function corrige(ev) {
    var pr = CFG.portRattache; if (!pr) return ev;
    return ev.map(function (e) {
      var coef = e.coef;
      if (coef == null) ev.forEach(function (x) {
        if (x.type === "PM" && x.coef != null && (coef == null || Math.abs(x.date - e.date) < Math.abs(e._b - e.date))) { coef = x.coef; e._b = x.date; }
      });
      var c = pr[e.type === "PM" ? "pm" : "bm"], f = Math.max(0, Math.min(1, ((coef == null ? 70 : coef) - 45) / 50));
      return { type: e.type, coef: e.coef,
        date: new Date(e.date.getTime() + Math.round(c.me.dt + (c.ve.dt - c.me.dt) * f) * 60000),
        h: e.h != null ? e.h + c.me.dh + (c.ve.dh - c.me.dh) * f : null };
    });
  }
  // Règle « jour J d'abord » : coefficient = pleine mer du jour la plus proche de maintenant ;
  // si aucune n'est disponible aujourd'hui, celle de la prochaine pleine mer (lendemain).
  function choisirCoef(ev, now) {
    var pm = null, jour = now.toDateString();
    ev.forEach(function (e) {
      if (e.type === "PM" && e.coef != null && e.date.toDateString() === jour &&
          (!pm || Math.abs(e.date - now) < Math.abs(pm.date - now))) pm = e;
    });
    if (!pm) for (var i = 0; i < ev.length; i++) if (ev[i].type === "PM" && ev[i].coef != null && ev[i].date > now) { pm = ev[i]; break; }
    return pm;
  }
  function estDemain(d, now) {
    return d.toDateString() === new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).toDateString();
  }
  function renderTide() {
    if (!tides) return;
    var now = new Date(), prev = null, next = null;
    for (var i = 0; i < tides.length; i++) { if (tides[i].date <= now) prev = tides[i]; else { next = tides[i]; break; } }
    var pm = choisirCoef(tides, now);                // jour J d'abord, sinon lendemain
    if (!next) return na("mwm-tide");
    var rising = prev ? prev.type === "BM" : next.type === "PM";
    $("mwm-tide").innerHTML =
      (pm ? '<span class="mwm-coef">Coef. ' + pm.coef + (estDemain(pm.date, now) ? " (J+1)" : "") + "</span>" : "") +
      '<span class="' + (rising ? "mwm-up" : "mwm-down") + '">' + (rising ? "↑ Montante" : "↓ Descendante") + "</span>" +
      "<small>" + (next.type === "PM" ? "Pleine mer" : "Basse mer") + (estDemain(next.date, now) ? " demain " : " ") + hm(next.date) + "</small>";
  }
  function loadTide() {
    var host = $("mwm-shom-host"); host.innerHTML = "";
    var f = document.createElement("iframe"), done = false, tries = 0;
    f.title = "Marées SHOM";
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body>' +
      '<script src="https://services.data.shom.fr/hdm/vignette/grande/' + encodeURIComponent(CFG.shomPort) + '?locale=fr"><\/script></body></html>';
    function attempt() {
      if (done) return;
      var ev = []; try { ev = parseShom(f.contentDocument); } catch (e) {}
      if (ev.length >= 2) { done = true; tides = corrige(ev); renderTide(); }
      else if (++tries > 24) { done = true; $("mwm-tide").innerHTML = '<a href="https://maree.shom.fr/harbor/BREST" target="_blank" rel="noopener">voir le SHOM</a>'; }
      else setTimeout(attempt, 500);
    }
    f.onload = attempt; host.appendChild(f); setTimeout(attempt, 1500);
  }

  /* ---------------- 2) VigiEau ---------------- */
  var GRAV = {
    vigilance: { o: 1, lbl: "Vigilance", col: "#e0b100" }, alerte: { o: 2, lbl: "Alerte", col: "#e67e22" },
    alerte_renforcee: { o: 3, lbl: "Alerte renforcée", col: "#d64535" }, crise: { o: 4, lbl: "Crise", col: "#8e1b3e" }
  };
  function loadVigi() {
    getJSON("https://api.vigieau.gouv.fr/api/zones?lon=" + CFG.vigieauLon + "&lat=" + CFG.vigieauLat +
      "&commune=" + CFG.vigieauInsee + "&profil=" + CFG.vigieauProfil).then(function (z) {
      z = (Array.isArray(z) ? z : z ? [z] : []).filter(function (x) { return x && GRAV[x.niveauGravite]; });
      if (!z.length) { $("mwm-vigi").innerHTML = pill("Aucune restriction", "#2e9e6a", "vigi"); return; }
      z.sort(function (a, b) { return GRAV[b.niveauGravite].o - GRAV[a.niveauGravite].o; });
      var g = GRAV[z[0].niveauGravite];
      $("mwm-vigi").innerHTML = pill(g.lbl, g.col, "vigi");
    }).catch(function () { na("mwm-vigi"); });
  }

  /* ---------------- 3) Nappe ---------------- */
  var NAPPE = [
    { max: .10, crit: "Critique", col: "#c0392b" }, { max: .20, crit: "Préoccupante", col: "#e67e22" },
    { max: .40, crit: "Vigilance", col: "#e0b100" }, { max: .60, crit: "Normale", col: "#2e9e6a" },
    { max: .80, crit: "Bonne", col: "#1aa39a" }, { max: .90, crit: "Très bonne", col: "#2f80c9" },
    { max: 1.01, crit: "Très bonne", col: "#1d4f91" }
  ];
  function loadNappe() {
    // Chronique journalière (historique, criticité, variations) + dernière mesure télétransmise (avec l'heure)
    var tr = getJSON("https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques_tr?code_bss=" + encodeURIComponent(CFG.bss) +
      "&size=1&sort=desc").then(function (j) { return (j.data || [])[0] || null; }).catch(function () { return null; });
    Promise.all([getJSON("https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques?code_bss=" + encodeURIComponent(CFG.bss) +
      "&fields=date_mesure,niveau_nappe_eau,profondeur_nappe&size=20000&sort=asc"), tr]).then(function (res) {
      var j = res[0], dtr = res[1];
      var d = (j.data || []).filter(function (r) { return r.niveau_nappe_eau != null && r.date_mesure; }).map(function (r) {
        var p = r.date_mesure.split("-"); return { t: Date.UTC(+p[0], +p[1] - 1, +p[2]), y: +p[0], v: r.niveau_nappe_eau, prof: r.profondeur_nappe };
      });
      if (!d.length) throw 0;
      var last = d[d.length - 1], p = rangSaison(d, last.t, last.v, 3);
      if (p == null) throw 0;
      var c = classe(NAPPE, p);
      // Niveau du jour comparé à J-7 et au même jour de l'année N-1 (en m, + = la nappe est plus haute)
      var J = 864e5;
      function ecart(tRef) {
        var b = mesureA(d, tRef, 3);
        return b ? Math.round((last.v - b.v) * 100) : null;
      }
      function fmt(cm, ref) {
        var fl = cm > 0 ? "↗" : cm < 0 ? "↘" : "→";
        return fl + " " + (cm === 0 ? "stable" : signed(cm / 100, 2, " m")) + " / " + ref;
      }
      var cm7 = ecart(last.t - 7 * J), cmN1 = ecart(last.t - 365 * J);
      var parts = [];
      if (cm7 != null) parts.push(fmt(cm7, "J-7"));
      if (cmN1 != null) parts.push(fmt(cmN1, "N-1"));
      // Date et heure de la dernière mesure : celle de la mesure télétransmise si elle est au moins aussi récente
      var prof = last.prof, quand = "mesure du " + jourCourt(new Date(last.t), true);
      var ttr = dtr && dtr.date_mesure ? new Date(dtr.date_mesure) : null;
      if (ttr && !isNaN(ttr) && ttr.getTime() >= last.t) {
        quand = "mesure du " + jourCourt(ttr) + (/T\d/.test(dtr.date_mesure) ? " à " + hm(ttr) : "");
        if (dtr.profondeur_nappe != null) prof = dtr.profondeur_nappe;
      }
      $("mwm-nappe").innerHTML = pill(c.crit, c.col, "nappe") +
        '<small class="mwm-date">' + quand + "</small>" +
        (prof != null ? "<small><i>eau à " + num(prof, 2) + " m sous la surface</i></small>" : "");
      $("mwm-nappe-var").textContent = parts.join(" · ");          // ligne pleine largeur, en italique
    }).catch(function () { na("mwm-nappe"); $("mwm-nappe-var").textContent = ""; });
  }

  /* ---------------- 4) Aulne ---------------- */
  var AULNE = [   // couleurs inversées : étiage en violet/bleu, crue en orange/rouge
    { max: .10, crit: "Critique (étiage)", col: "#5b2a86" }, { max: .25, crit: "Préoccupant", col: "#2f80c9" },
    { max: .40, crit: "Vigilance", col: "#1aa39a" }, { max: .60, crit: "Normal", col: "#2e9e6a" },
    { max: .75, crit: "Normal", col: "#e0b100" }, { max: .90, crit: "Vigilance", col: "#e67e22" },
    { max: 1.01, crit: "Critique (crue)", col: "#c0392b" }
  ];
  function loadAulne() {
    var b = "https://hubeau.eaufrance.fr/api/v2/hydrometrie/", st = encodeURIComponent(CFG.stationAulne);
    Promise.all([
      getJSON(b + "observations_tr?code_entite=" + st + "&grandeur_hydro=Q&date_debut_obs=" +
        encodeURIComponent(new Date(Date.now() - 8.5 * 864e5).toISOString().slice(0, 19) + "Z") +
        "&size=5000&sort=desc&format=json"),
      getJSON(b + "obs_elab?code_entite=" + st + "&grandeur_hydro_elab=QmnJ&fields=date_obs_elab,resultat_obs_elab&size=20000&format=json"),
      // hauteur d'eau à l'échelle (mm) sur 8 jours : sert aux variations en cm
      getJSON(b + "observations_tr?code_entite=" + st + "&grandeur_hydro=H&date_debut_obs=" +
        encodeURIComponent(new Date(Date.now() - 8.5 * 864e5).toISOString().slice(0, 19) + "Z") +
        "&size=5000&sort=desc&format=json").catch(function () { return { data: [] }; }),
      // hauteur maximale de chaque jour depuis 2010 (mm) : sert à situer la hauteur actuelle par rapport aux mêmes dates
      getJSON(b + "obs_elab?code_entite=" + st + "&grandeur_hydro_elab=HIXnJ&fields=date_obs_elab,resultat_obs_elab&size=20000&format=json")
        .catch(function () { return { data: [] }; })
    ]).then(function (res) {
      var q = (res[0].data || []).filter(function (r) { return r.resultat_obs != null; })
        .map(function (r) { return { t: new Date(r.date_obs).getTime(), v: r.resultat_obs }; });
      if (!q.length) throw 0;
      var day = q.filter(function (r) { return r.t > q[0].t - 864e5; });
      var qNow = day.reduce(function (s, r) { return s + r.v; }, 0) / day.length;
      function elab(r) {
        return (r.data || []).filter(function (x) { return x.resultat_obs_elab != null; }).map(function (x) {
          var p = x.date_obs_elab.split("-"); return { t: Date.UTC(+p[0], +p[1] - 1, +p[2]), y: +p[0], v: x.resultat_obs_elab };
        });
      }
      var hist = elab(res[1]), histH = elab(res[3]);
      // Variation de la hauteur d'eau (en cm) : dernière mesure comparée à J-1 et J-7 à la même heure environ
      var h = (res[2].data || []).filter(function (r) { return r.resultat_obs != null; })
        .map(function (r) { return { t: new Date(r.date_obs).getTime(), v: r.resultat_obs }; })
        .sort(function (a, b) { return b.t - a.t; });
      function procheDe(t, tol) {
        var best = null;
        h.forEach(function (r) { var d = Math.abs(r.t - t); if (d <= tol && (!best || d < best.d)) best = { r: r, d: d }; });
        return best && best.r;
      }
      function cmVs(jours, tolH, lbl) {
        if (!h.length) return null;
        var ref = procheDe(h[0].t - jours * 864e5, tolH * 3600e3); if (!ref) return null;
        var cm = Math.round((h[0].v - ref.v) / 10), fl = cm > 0 ? "↗" : cm < 0 ? "↘" : "→";   // mm -> cm
        return fl + " " + (cm === 0 ? "stable" : signed(cm, 0, " cm")) + " / " + lbl;
      }
      var parts = [cmVs(1, 1, "J-1"), cmVs(7, 3, "J-7")].filter(Boolean);
      // Situation (étiage … crue) selon la HAUTEUR d'eau du moment (dernière mesure),
      // classée parmi les hauteurs maximales journalières des mêmes dates (± 10 jours) des années précédentes.
      // Repli sur le débit si la hauteur n'est pas disponible.
      var p = null, base = "";
      if (h.length && histH.length) {
        p = rangSaison(histH, h[0].t, h[0].v, 5);            // hauteur du moment (dernière mesure), comme le widget Hydro
        if (p != null) base = "hauteur du moment (" + num(h[0].v / 1000, 2) + " m à " + hm(new Date(h[0].t)) + ")";
      }
      if (p == null) { p = rangSaison(hist, q[0].t, qNow, 5); if (p != null) base = "débit moyen des 24 dernières heures"; }
      if (p == null) throw 0;
      var c = classe(AULNE, p);
      // Variation du débit du jour (moyenne 24 h) en % : vs J-7 et vs le même jour de l'année N-1
      function pctVs(ref, lbl) {
        if (!ref) return null;
        var pc = Math.round((qNow - ref) / ref * 100), fl = pc > 0 ? "↗" : pc < 0 ? "↘" : "→";
        return fl + " " + (Math.abs(pc) < 1 ? "stable" : signed(pc, 0, " %")) + " / " + lbl;
      }
      var old = q.filter(function (r) { return r.t <= q[0].t - 7 * 864e5 && r.t > q[0].t - 8 * 864e5; });
      var q7 = old.length ? old.reduce(function (s, r) { return s + r.v; }, 0) / old.length : null;
      // J-1 : moyenne des 24 h précédentes (de 48 h à 24 h avant la dernière mesure)
      var veille = q.filter(function (r) { return r.t <= q[0].t - 864e5 && r.t > q[0].t - 2 * 864e5; });
      var q1 = veille.length ? veille.reduce(function (s, r) { return s + r.v; }, 0) / veille.length : null;
      var d0 = new Date(q[0].t), jourN1 = Date.UTC(d0.getUTCFullYear() - 1, d0.getUTCMonth(), d0.getUTCDate());
      hist.sort(function (a, b) { return a.t - b.t; });
      var mN1 = mesureA(hist, jourN1, 3);                         // débit moyen journalier, même jour N-1
      // Débit affiché : dernière mesure (comme Vigicrues) ; les variations en % comparent des moyennes sur 24 h
      var qLast = q[0].v;
      var debit = ["débit " + num(qLast / 1000, 1) + " m³/s"]                 // une seule décimale
        .concat([pctVs(q1, "J-1"), pctVs(q7, "J-7"), pctVs(mN1 && mN1.v, "N-1")].filter(Boolean));
      $("mwm-aulne").title = "Situation selon la " + base + ", comparée aux mêmes dates des années précédentes : " +
        Math.round(p * 100) + " % des années étaient plus basses.";
      $("mwm-aulne").innerHTML = pill(c.crit, c.col, "aulne") +
        '<small class="mwm-date">mesure du ' + jourCourt(new Date(q[0].t)) + " à " + hm(new Date(q[0].t)) + "</small>";
      // ligne débit : valeur + variations en % ; elle peut passer sur 2 lignes, sans couper une variation
      $("mwm-aulne-debit").innerHTML = debit.map(function (s) { return '<span class="mwm-nw">' + s + "</span>"; }).join(" · ");
      $("mwm-aulne-debit").title = "Dernière mesure à " + hm(new Date(q[0].t)) + " · moyenne sur 24 h : " +
        num(qNow / 1000, 1) + " m³/s (base des variations en %)";
      // hauteur à l'échelle (dernière mesure, mm -> m) puis variations en cm
      if (h.length) parts.unshift(num(h[0].v / 1000, 2) + " m");
      // Variation vs N-1 : seules les hauteurs maximales journalières sont conservées d'une année sur l'autre ;
      // on compare donc la hauteur maximale des 24 dernières heures à celle du même jour de l'année précédente (± 3 j).
      var infoN1 = "";
      if (h.length && histH.length) {
        histH.sort(function (a, b) { return a.t - b.t; });
        var d0 = new Date(h[0].t), refN1 = mesureA(histH, Date.UTC(d0.getUTCFullYear() - 1, d0.getUTCMonth(), d0.getUTCDate()), 3);
        if (refN1) {
          var hMax24 = Math.max.apply(null, h.filter(function (r) { return r.t > h[0].t - 864e5; }).map(function (r) { return r.v; }));
          var cmN1 = Math.round((hMax24 - refN1.v) / 10), flN1 = cmN1 > 0 ? "↗" : cmN1 < 0 ? "↘" : "→";
          parts.push(flN1 + " " + (cmN1 === 0 ? "stable" : signed(cmN1, 0, " cm")) + " / N-1");
          infoN1 = " · N-1 : hauteur maximale des 24 dernières heures (" + num(hMax24 / 1000, 2) + " m) comparée à celle du " +
            new Date(refN1.t).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) +
            " (" + num(refN1.v / 1000, 2) + " m)";
        }
      }
      // ligne pleine largeur, en italique ; elle peut passer sur 2 lignes, sans couper une variation
      $("mwm-aulne-var").innerHTML = parts.length ? "hauteur " + parts.map(function (s) { return '<span class="mwm-nw">' + s + "</span>"; }).join(" · ") : "";
      $("mwm-aulne-var").title = h.length ? "Hauteur d'eau à l'échelle de la station, mesure de " + hm(new Date(h[0].t)) + infoN1 : "";
    }).catch(function () { na("mwm-aulne"); $("mwm-aulne-debit").textContent = ""; $("mwm-aulne-var").textContent = ""; });
  }

  /* ---------------- Échelles de situation (icône ⓘ) ---------------- */
  function lignesRang(list) {
    var prev = 0;
    return list.map(function (c) {
      var hi = Math.round(c.max * 100), lo = Math.round(prev * 100); prev = c.max;
      var txt = lo === 0 ? "moins de " + hi + " %" : hi > 100 ? lo + " % et plus" : lo + " à " + hi + " %";
      return [pill(c.crit, c.col), txt];
    });
  }
  var ECHELLES = {
    vigi: { titre: "Vigilance eau · Châteaulin",
      texte: "Niveau de restriction officiel en vigueur (arrêté préfectoral publié sur VigiEau). Le plus grave des zones s'applique : rivières, nappes, eau potable.",
      lignes: function () {
        return [[pill("Aucune restriction", "#2e9e6a"), "pas d'arrêté de restriction"]].concat(Object.keys(GRAV).map(function (k) {
          var m = { vigilance: "économies d'eau conseillées", alerte: "premières restrictions d'usage",
            alerte_renforcee: "restrictions renforcées", crise: "usages limités aux besoins prioritaires" }[k];
          return [pill(GRAV[k].lbl, GRAV[k].col), m];
        }));
      } },
    aulne: { titre: "Niveau de l'Aulne · Châteaulin",
      texte: "Hauteur d'eau du moment (dernière mesure, toutes les 5 minutes), comparée aux hauteurs maximales journalières des mêmes dates (± 10 jours) des années 2010 à 2025. Le pourcentage est la part des années où la hauteur était plus basse.",
      lignes: function () { return lignesRang(AULNE); } },
    nappe: { titre: "Nappe · Saint-Ségal",
      texte: "Dernier niveau journalier de la nappe, comparé aux mêmes dates (± 10 jours) des années précédentes (depuis 2004). Le pourcentage est la part des années où le niveau était plus bas.",
      lignes: function () { return lignesRang(NAPPE); } }
  };
  var ov = document.createElement("div");
  ov.className = "mwm-ov"; ov.hidden = true; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "false");
  root.appendChild(ov);
  var ouvertePar = null;
  function fermer() { ov.hidden = true; if (ouvertePar) { try { ouvertePar.focus(); } catch (e) {} } ouvertePar = null; }
  function ouvrir(cle, btn) {
    var e = ECHELLES[cle]; if (!e) return;
    ov.setAttribute("aria-label", "Échelle de situation : " + e.titre);
    ov.innerHTML = '<button type="button" class="mwm-ov-x" aria-label="Fermer">×</button><h4>' + e.titre + "</h4><p>" + e.texte + "</p><table>" +
      e.lignes().map(function (l) { return "<tr><td>" + l[0] + "</td><td>" + l[1] + "</td></tr>"; }).join("") + "</table>";
    ov.hidden = false; ov.scrollTop = 0; ouvertePar = btn;
    ov.querySelector(".mwm-ov-x").focus();
  }
  root.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest(".mwm-info, .mwm-ov-x");
    if (!b) return;
    if (b.classList.contains("mwm-ov-x")) { fermer(); return; }
    if (!ov.hidden && ouvertePar === b) { fermer(); return; }
    ouvrir(b.getAttribute("data-echelle"), b);
  });
  root.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !ov.hidden) fermer(); });

  /* ---------------- Lancement ---------------- */
  if (CFG.lienDetail) {
    $("mwm-sources").innerHTML += ' · <a href="' + CFG.lienDetail + '">Voir le détail</a>';
  }
  function tick() { var d = new Date(); $("mwm-time").textContent = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " · " + hm(d); }
  function refreshAll() { loadTide(); loadVigi(); loadNappe(); loadAulne(); }
  tick(); refreshAll();
  setInterval(refreshAll, CFG.refreshMinutes * 60000);
  setInterval(function () { tick(); renderTide(); }, 60000);
})();
</script>
<script>
  // Signale la hauteur du widget à la page qui l'affiche (site antreizh.fr ou appli), pour ajuster le cadre
  (function () {
    if (window.parent === window) return;
    var last = 0;
    function envoyer() {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ hydraulneHauteur: h }, "*"); }
    }
    if (window.ResizeObserver) new ResizeObserver(envoyer).observe(document.body);
    window.addEventListener("load", envoyer);
    setTimeout(envoyer, 500); setTimeout(envoyer, 2000); setTimeout(envoyer, 5000);
  })();
</script>
</body>
</html>
