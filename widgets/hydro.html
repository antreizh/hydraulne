<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydro · antreizh.fr</title>
<style>html,body{margin:0;background:transparent}body{padding:1px}</style>
</head>
<body>
<!-- Widget servi depuis https://appli.antreizh.fr/widgets/ : toujours à jour sur le site -->
<!-- =====================================================================
     Widget « Hydro » — Châteaulin · Saint-Ségal (sans le bloc Marée)
     À coller tel quel dans un bloc « Code HTML » de WebAcappella.
     Sources : VigiEau (restrictions d'eau), Hub'Eau HydroPortail (Aulne), Hub'Eau/ADES (nappe)
     Préfixe mwh- : peut cohabiter sur la même page avec les autres widgets.
     ===================================================================== -->
<div id="mwh-widget">
  <div class="mwh-head">
    <div class="mwh-title"><span class="mwh-emoji">🌊</span> Situation hydrologique</div>
    <div class="mwh-updated" id="mwh-updated">Chargement des données…</div>
  </div>

  <div class="mwh-grid">
    <!-- ===== VigiEau ===== -->
    <section class="mwh-card">
      <h3 class="mwh-h3"><span class="mwh-ico mwh-ico-drop">💧</span> Vigilance eau à Châteaulin</h3>
      <div id="mwh-vigi" class="mwh-body"><div class="mwh-loading"><span></span><span></span><span></span></div></div>
      <p class="mwh-src">Source <a href="https://vigieau.gouv.fr/" target="_blank" rel="noopener">VigiEau</a> · arrêtés préfectoraux</p>
    </section>


    <!-- ===== Aulne ===== -->
    <section class="mwh-card">
      <h3 class="mwh-h3"><span class="mwh-ico mwh-ico-river">🏞️</span> Niveau de l'Aulne</h3>
      <div id="mwh-aulne" class="mwh-body"><div class="mwh-loading"><span></span><span></span><span></span></div></div>
      <p class="mwh-src">Station de Châteaulin – Pont routier · <a href="https://www.hydro.eaufrance.fr/stationhydro/J382182001/fiche" target="_blank" rel="noopener">HydroPortail</a> via Hub'Eau · crues : <a href="https://www.vigicrues.gouv.fr/" target="_blank" rel="noopener">Vigicrues</a></p>
    </section>

    <!-- ===== Nappe ===== -->
    <section class="mwh-card">
      <h3 class="mwh-h3"><span class="mwh-ico mwh-ico-ground">🌱</span> Nappe de Saint-Ségal</h3>
      <div id="mwh-nappe" class="mwh-body"><div class="mwh-loading"><span></span><span></span><span></span></div></div>
      <p class="mwh-src">Piézomètre de Kergadalen · <a href="https://ades.eaufrance.fr/Fiche/PtEau?Code=03103X0047/PZ" target="_blank" rel="noopener">ADES</a> via Hub'Eau</p>
    </section>
  </div>
</div>

<style>
/* Toutes les tailles sont multipliées par --k, calculé selon la largeur allouée au widget */
#mwh-widget{
  --mwh-navy:#0b3c5d; --mwh-blue:#1f7bb6; --mwh-sky:#e8f4fb; --mwh-sand:#fbf7ef;
  --mwh-ink:#1d2b36; --mwh-muted:#5f7180; --mwh-line:#e3e9ee; --mwh-radius:calc(18px*var(--k));
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--mwh-ink); background:var(--mwh-sand); border-radius:calc(22px*var(--k));
  padding:calc(18px*var(--k)); box-sizing:border-box; width:100%; line-height:1.4; --k:1;
  border:1px solid #d5dde4;                                             /* cadre gris très fin */
}
#mwh-widget *,#mwh-widget *::before,#mwh-widget *::after{box-sizing:border-box}
#mwh-widget a{color:var(--mwh-blue)}
#mwh-widget .mwh-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:calc(6px*var(--k)) calc(16px*var(--k));margin:2px calc(4px*var(--k)) calc(14px*var(--k))}
#mwh-widget .mwh-title{font-size:calc(20px*var(--k));font-weight:700;color:var(--mwh-navy)}
#mwh-widget .mwh-emoji{display:inline-block;animation:mwh-bob 3s ease-in-out infinite}
#mwh-widget .mwh-updated{font-size:calc(13px*var(--k));color:var(--mwh-muted)}
/* Par défaut : les 3 blocs sur une même ligne.
   Responsive selon la largeur disponible (ordinateur / tablette / téléphone) :
   3 colonnes ≥ 900 px · 2 colonnes de 560 à 900 px (la Nappe passe dessous, pleine largeur) · 1 colonne en dessous */
#mwh-widget .mwh-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(14px*var(--k));align-items:stretch}
#mwh-widget.mwh-c2 .mwh-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#mwh-widget.mwh-c2 .mwh-grid > .mwh-card:last-child:nth-child(odd){grid-column:1 / -1}
#mwh-widget.mwh-narrow .mwh-grid{grid-template-columns:1fr}
/* Secours sans JavaScript : selon l'écran */
@media (max-width:900px){#mwh-widget:not([data-mwh-init]) .mwh-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){#mwh-widget:not([data-mwh-init]) .mwh-grid{grid-template-columns:1fr}}
#mwh-widget .mwh-card{background:#fff;border:1px solid #d5dde4;border-radius:var(--mwh-radius);padding:calc(16px*var(--k)) calc(16px*var(--k)) calc(10px*var(--k));box-shadow:0 2px calc(10px*var(--k)) rgba(11,60,93,.08);display:flex;flex-direction:column;min-width:0}
#mwh-widget .mwh-h3{margin:0 0 calc(12px*var(--k));font-size:calc(16px*var(--k));font-weight:700;color:var(--mwh-navy);display:flex;align-items:center;gap:calc(8px*var(--k))}
#mwh-widget .mwh-ico{width:calc(30px*var(--k));height:calc(30px*var(--k));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:calc(15px*var(--k))}
#mwh-widget .mwh-ico-sea{background:#e1effa}
#mwh-widget .mwh-ico-drop{background:#e3f6f4}
#mwh-widget .mwh-ico-ground{background:#eef6e3}
#mwh-widget .mwh-ico-river{background:#e6f0f7}
#mwh-widget .mwh-body{flex:1}
#mwh-widget .mwh-src{margin:calc(12px*var(--k)) 0 0;padding-top:calc(8px*var(--k));border-top:1px solid var(--mwh-line);font-size:calc(11.5px*var(--k));color:var(--mwh-muted)}
#mwh-widget .mwh-muted{color:var(--mwh-muted);font-size:calc(13px*var(--k))}
#mwh-widget .mwh-err{font-size:calc(14px*var(--k));color:var(--mwh-muted);background:#f6f8fa;border-radius:calc(12px*var(--k));padding:calc(10px*var(--k)) calc(12px*var(--k))}

/* chargement */
#mwh-widget .mwh-loading{display:flex;gap:calc(6px*var(--k));padding:calc(24px*var(--k)) 0;justify-content:center}
#mwh-widget .mwh-loading span{width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;background:var(--mwh-blue);opacity:.35;animation:mwh-dot 1.2s infinite}
#mwh-widget .mwh-loading span:nth-child(2){animation-delay:.2s}
#mwh-widget .mwh-loading span:nth-child(3){animation-delay:.4s}

/* ---- Pastilles de niveau ---- */
/* Icône ⓘ devant chaque situation et cadre des échelles (dans la carte de la rubrique) */
#mwh-widget .mwh-card{position:relative}
#mwh-widget .mwh-info{all:unset;cursor:pointer;display:inline-block;vertical-align:middle;font-size:calc(14px*var(--k));line-height:1;font-weight:400;
  color:#fff;opacity:.85;padding:calc(2px*var(--k));margin:0 calc(6px*var(--k)) calc(2px*var(--k)) 0;border-radius:50%}
#mwh-widget .mwh-info:hover,#mwh-widget .mwh-info:focus-visible{opacity:1;outline:1px solid rgba(255,255,255,.8)}
#mwh-widget .mwh-ov{position:absolute;inset:0;z-index:5;background:#fff;border-radius:inherit;padding:calc(16px*var(--k));overflow:auto;box-shadow:0 0 0 1px #d5dde4 inset}
#mwh-widget .mwh-ov[hidden]{display:none}
#mwh-widget .mwh-ov h4{margin:0 calc(26px*var(--k)) calc(6px*var(--k)) 0;font-size:calc(16px*var(--k));color:var(--mwh-navy)}
#mwh-widget .mwh-ov p{margin:0 0 calc(10px*var(--k));font-size:calc(12.5px*var(--k));color:var(--mwh-muted);line-height:1.4}
#mwh-widget .mwh-ov table{border-collapse:collapse;font-size:calc(13px*var(--k))}
#mwh-widget .mwh-ov td:nth-child(2){white-space:nowrap}
#mwh-widget .mwh-ov td{padding:calc(3px*var(--k)) 0;vertical-align:middle}
#mwh-widget .mwh-ov td + td{padding-left:calc(10px*var(--k))}
#mwh-widget .mwh-ov td.mwh-ov-l{color:var(--mwh-muted)}
#mwh-widget .mwh-ov-pill{display:inline-block;white-space:nowrap;color:#fff;font-weight:700;font-size:calc(12px*var(--k));border-radius:999px;padding:calc(2px*var(--k)) calc(9px*var(--k))}
#mwh-widget .mwh-ov-x{all:unset;cursor:pointer;position:absolute;top:calc(10px*var(--k));right:calc(12px*var(--k));font-size:calc(22px*var(--k));line-height:1;color:var(--mwh-muted)}
#mwh-widget .mwh-ov-x:hover,#mwh-widget .mwh-ov-x:focus-visible{color:var(--mwh-ink)}
#mwh-widget .mwh-badge{display:flex;align-items:center;gap:calc(12px*var(--k));border-radius:calc(14px*var(--k));padding:calc(12px*var(--k)) calc(14px*var(--k));color:#fff}
#mwh-widget .mwh-badge-ico{font-size:calc(26px*var(--k));line-height:1}
#mwh-widget .mwh-badge-lbl{font-size:calc(12px*var(--k));opacity:.9;text-transform:uppercase;letter-spacing:.04em}
#mwh-widget .mwh-badge-val{font-size:calc(21px*var(--k));font-weight:800;line-height:1.15}
#mwh-widget .mwh-msg{font-size:calc(14px*var(--k));margin:calc(10px*var(--k)) 0 calc(8px*var(--k))}
#mwh-widget .mwh-chips{display:flex;flex-wrap:wrap;gap:calc(6px*var(--k));margin:calc(6px*var(--k)) 0}
#mwh-widget .mwh-chip{font-size:calc(12px*var(--k));border-radius:calc(999px*var(--k));padding:calc(3px*var(--k)) calc(9px*var(--k));background:#f1f4f7;color:var(--mwh-ink);display:inline-flex;align-items:center;gap:calc(5px*var(--k))}
#mwh-widget .mwh-chip i{width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;display:inline-block}
#mwh-widget details{margin-top:calc(8px*var(--k));font-size:calc(13px*var(--k))}
#mwh-widget summary{cursor:pointer;color:var(--mwh-blue);font-weight:600}
#mwh-widget details ul{margin:calc(8px*var(--k)) 0 0;padding-left:calc(18px*var(--k));max-height:calc(220px*var(--k));overflow:auto}
#mwh-widget details li{margin-bottom:calc(6px*var(--k))}
#mwh-widget details li span{color:var(--mwh-muted)}

/* ---- Jauge nappe ---- */
#mwh-widget .mwh-gauge{position:relative;margin:calc(16px*var(--k)) 0 calc(6px*var(--k))}
#mwh-widget .mwh-gauge-bar{display:flex;height:calc(12px*var(--k));border-radius:calc(999px*var(--k));overflow:hidden}
#mwh-widget .mwh-gauge-bar span{flex:1}
#mwh-widget .mwh-gauge-pin{position:absolute;top:-6px;width:calc(4px*var(--k));height:calc(24px*var(--k));border-radius:calc(3px*var(--k));background:var(--mwh-ink);box-shadow:0 0 0 2px #fff;transform:translateX(-50%);transition:left 1s ease}
#mwh-widget .mwh-gauge-legend{display:flex;justify-content:space-between;font-size:calc(11px*var(--k));color:var(--mwh-muted);margin-top:calc(4px*var(--k))}
#mwh-widget .mwh-kv{display:grid;grid-template-columns:auto 1fr;gap:calc(4px*var(--k)) calc(10px*var(--k));font-size:calc(13.5px*var(--k));margin-top:calc(10px*var(--k))}
#mwh-widget .mwh-kv dt{color:var(--mwh-muted)}
#mwh-widget .mwh-kv dd{margin:0;font-weight:600;text-align:right}

@keyframes mwh-dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes mwh-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#mwh-widget *{animation:none!important;transition:none!important}}
/* espace très étroit (classe posée par le script selon la largeur du widget) */
#mwh-widget.mwh-xs{padding:calc(12px*var(--k));border-radius:calc(16px*var(--k))}
#mwh-widget.mwh-xs .mwh-title{font-size:calc(17px*var(--k))}
#mwh-widget.mwh-xs .mwh-card{padding:calc(14px*var(--k)) calc(12px*var(--k)) calc(10px*var(--k))}
#mwh-widget.mwh-xs .mwh-row{font-size:calc(13px*var(--k));gap:calc(6px*var(--k));padding:calc(7px*var(--k)) calc(4px*var(--k))}
#mwh-widget.mwh-xs .mwh-row .mwh-tag{flex-basis:calc(70px*var(--k));font-size:calc(10.5px*var(--k))}
</style>

<script>
(function () {
  "use strict";

  /* ================== PARAMÈTRES (modifiables) ================== */
  var CFG = {
    vigieauInsee: "29026",             // code INSEE de Châteaulin
    vigieauLat: 48.1966, vigieauLon: -4.0903,
    vigieauProfil: "particulier",      // particulier | exploitation | collectivite | entreprise
    bss: "03103X0047/PZ",              // piézomètre de Kergadalen (Saint-Ségal)
    stationAulne: "J382182001",        // L'Aulne à Châteaulin – Pont routier (sonde Vigicrues)
    nappeFenetreJours: 10,             // ± jours autour de la date pour comparer aux années passées
    refreshMinutes: 30
  };
  /* ============================================================== */

  var root = document.getElementById("mwh-widget");
  if (!root || root.getAttribute("data-mwh-init")) return;
  root.setAttribute("data-mwh-init", "1");

  /* ---- Taille de police auto-adaptative : selon la largeur réellement allouée au widget ---- */
  function fit() {
    var w = root.clientWidth; if (!w) return;
    // 3 blocs sur une ligne si la place le permet, sinon 2, sinon 1 (téléphone)
    var cols = w >= 900 ? 3 : (w >= 560 ? 2 : 1);
    var colW = (w - 40 - 14 * (cols - 1)) / cols;                   // largeur approximative d'une carte
    // taille de référence : carte de 340 px (plusieurs colonnes) ou 380 px (1 colonne)
    var k = cols === 1 ? Math.max(0.85, Math.min(1.1, colW / 380))
                       : Math.max(0.82, Math.min(1.3, colW / 340));
    root.style.setProperty("--k", k.toFixed(3));
    root.classList.toggle("mwh-narrow", cols === 1);
    root.classList.toggle("mwh-c2", cols === 2);
    root.classList.toggle("mwh-c3", cols === 3);
    root.classList.toggle("mwh-xs", w < 420);
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
  window.addEventListener("resize", fit);

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hm(d) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function dmy(d) { return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  function num(x, n) { return x.toLocaleString("fr-FR", { minimumFractionDigits: n, maximumFractionDigits: n }); }
  function fail(id, msg, link) {
    $(id).innerHTML = '<div class="mwh-err">' + esc(msg) +
      (link ? ' <a href="' + link + '" target="_blank" rel="noopener">Voir la source</a>' : "") + "</div>";
  }
  // Requête JSON avec délai maximal (20 s) et une seconde tentative : Hub'Eau laisse parfois une requête sans réponse
  function getJSON(url, essai) {
    var ctl = window.AbortController ? new AbortController() : null;
    var minuterie = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : null;
    return fetch(url, { headers: { Accept: "application/json" }, signal: ctl ? ctl.signal : undefined }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    }).then(function (j) { clearTimeout(minuterie); return j; }, function (e) {
      clearTimeout(minuterie);
      if (!essai && !(e && e.status >= 400 && e.status < 500)) return getJSON(url, 1);
      throw e;
    });
  }

  /* ------------------------------------------------------------------
     1) VIGIEAU — niveau de restriction à Châteaulin
     ------------------------------------------------------------------ */
  var GRAV = {
    vigilance:        { o: 1, lbl: "Vigilance",        col: "#e0b100", ico: "👀", msg: "Pas de restriction, mais soyons économes : chaque goutte compte." },
    alerte:           { o: 2, lbl: "Alerte",           col: "#e67e22", ico: "⚠️", msg: "Des restrictions d'usage de l'eau sont en vigueur." },
    alerte_renforcee: { o: 3, lbl: "Alerte renforcée", col: "#d64535", ico: "🚱", msg: "Restrictions renforcées : les usages non essentiels sont limités." },
    crise:            { o: 4, lbl: "Crise",            col: "#8e1b3e", ico: "🛑", msg: "Situation de crise : seuls les usages prioritaires (santé, sécurité, eau potable) sont autorisés." }
  };
  var TYPES = { SUP: "Rivières (eaux de surface)", SOU: "Eaux souterraines", AEP: "Eau du robinet" };
  var THEME_ICO = { Arroser: "🪴", Nettoyer: "🧽", "Remplir ou vidanger": "🏊", "Ouvrages hydrauliques": "🚧", Irriguer: "🌾", Prélever: "🪣" };

  function loadVigieau() {
    var url = "https://api.vigieau.gouv.fr/api/zones?lon=" + CFG.vigieauLon + "&lat=" + CFG.vigieauLat +
      "&commune=" + CFG.vigieauInsee + "&profil=" + CFG.vigieauProfil;
    getJSON(url).then(function (zones) {
      if (!Array.isArray(zones)) zones = zones ? [zones] : [];
      zones = zones.filter(function (z) { return z && GRAV[z.niveauGravite]; });
      if (!zones.length) {
        $("mwh-vigi").innerHTML =
          '<div class="mwh-badge" style="background:#2e9e6a"><div class="mwh-badge-ico">😊</div><div>' +
          '<div class="mwh-badge-lbl">Situation</div><div class="mwh-badge-val">' + info("vigi") + 'Aucune restriction</div></div></div>' +
          '<p class="mwh-msg">Aucun arrêté sécheresse en vigueur à Châteaulin. Les bons gestes restent de mise !</p>';
        return;
      }
      zones.sort(function (a, b) { return GRAV[b.niveauGravite].o - GRAV[a.niveauGravite].o; });
      var worst = zones[0], g = GRAV[worst.niveauGravite];
      var chips = zones.map(function (z) {
        var gz = GRAV[z.niveauGravite];
        return '<span class="mwh-chip"><i style="background:' + gz.col + '"></i>' + esc(TYPES[z.type] || z.type) + " : " + gz.lbl + "</span>";
      }).join("");

      var ref = zones.filter(function (z) { return z.type === "AEP"; })[0] || worst;
      var usages = (ref.usages || []).filter(function (u) { return u.concerneParticulier !== false; });
      var list = usages.map(function (u) {
        var d = String(u.description || "").replace(/\s+/g, " ").trim();
        return "<li>" + (THEME_ICO[u.thematique] || "•") + " <b>" + esc(u.nom) + "</b><br><span>" + esc(d) + "</span></li>";
      }).join("");

      var a = worst.arrete || {};
      var fin = a.dateFinValidite ? dmy(new Date(a.dateFinValidite)) : null;

      $("mwh-vigi").innerHTML =
        '<div class="mwh-badge" style="background:' + g.col + '"><div class="mwh-badge-ico">' + g.ico + "</div><div>" +
        '<div class="mwh-badge-lbl">Niveau en vigueur · ' + esc(worst.nom || "") + '</div><div class="mwh-badge-val">' + info("vigi") + g.lbl + "</div></div></div>" +
        '<p class="mwh-msg">' + g.msg + "</p>" +
        '<div class="mwh-chips">' + chips + "</div>" +
        (fin ? '<div class="mwh-muted">Arrêté valable jusqu\'au ' + fin +
          (a.cheminFichier ? ' · <a href="' + esc(a.cheminFichier) + '" target="_blank" rel="noopener">lire l\'arrêté</a>' : "") + "</div>" : "") +
        (list ? "<details><summary>Ce qui est interdit ou limité (" + usages.length + ")</summary><ul>" + list + "</ul></details>" : "");
    }).catch(function (e) {
      fail("mwh-vigi", e && e.status === 404 ? "Données VigiEau indisponibles pour ce secteur." :
        "Impossible de joindre VigiEau pour le moment.", "https://vigieau.gouv.fr/");
    });
  }

  /* ------------------------------------------------------------------
     2) NAPPE — niveau du piézomètre comparé aux années passées
     ------------------------------------------------------------------ */
  var CLASSES = [
    { max: 0.10, lbl: "Très bas",             crit: "Critique",     col: "#c0392b", ico: "🔴" },
    { max: 0.20, lbl: "Bas",                  crit: "Préoccupante", col: "#e67e22", ico: "🟠" },
    { max: 0.40, lbl: "Modérément bas",       crit: "Vigilance",    col: "#e0b100", ico: "🟡" },
    { max: 0.60, lbl: "Proche de la normale", crit: "Normale",      col: "#2e9e6a", ico: "🟢" },
    { max: 0.80, lbl: "Modérément haut",      crit: "Bonne",        col: "#1aa39a", ico: "🟢" },
    { max: 0.90, lbl: "Haut",                 crit: "Très bonne",   col: "#2f80c9", ico: "🔵" },
    { max: 1.01, lbl: "Très haut",            crit: "Très bonne",   col: "#1d4f91", ico: "🔵" }
  ];

  function loadNappe() {
    var url = "https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques?code_bss=" + encodeURIComponent(CFG.bss) +
      "&fields=date_mesure,niveau_nappe_eau,profondeur_nappe&size=20000&sort=asc";
    getJSON(url).then(function (json) {
      var data = (json.data || []).filter(function (r) { return r.niveau_nappe_eau != null && r.date_mesure; })
        .map(function (r) {
          var p = r.date_mesure.split("-");
          return { t: Date.UTC(+p[0], +p[1] - 1, +p[2]), y: +p[0], v: r.niveau_nappe_eau, prof: r.profondeur_nappe };
        });
      if (data.length < 30) throw new Error("données insuffisantes");

      var last = data[data.length - 1], lastD = new Date(last.t);
      var win = CFG.nappeFenetreJours * 864e5, byYear = {};
      data.forEach(function (r) {
        if (r.y === last.y && Math.abs(r.t - last.t) < 365 * 864e5 / 2) return;
        var center = Date.UTC(r.y, lastD.getUTCMonth(), lastD.getUTCDate());
        var yr = r.y;
        // gère le passage d'année (fenêtre autour du 1er janvier)
        if (Math.abs(r.t - center) > win) {
          var c2 = Date.UTC(r.y + 1, lastD.getUTCMonth(), lastD.getUTCDate());
          var c0 = Date.UTC(r.y - 1, lastD.getUTCMonth(), lastD.getUTCDate());
          if (Math.abs(r.t - c2) <= win) yr = r.y + 1; else if (Math.abs(r.t - c0) <= win) yr = r.y - 1; else return;
        }
        if (yr === last.y) return;
        (byYear[yr] = byYear[yr] || []).push(r.v);
      });
      var refs = Object.keys(byYear).filter(function (y) { return byYear[y].length >= 3; }).map(function (y) {
        var a = byYear[y]; return a.reduce(function (s, x) { return s + x; }, 0) / a.length;
      });
      if (refs.length < 5) throw new Error("historique insuffisant");

      var below = 0, eq = 0;
      refs.forEach(function (x) { if (x < last.v) below++; else if (x === last.v) eq++; });
      var p = (below + eq / 2) / refs.length;
      var cls = CLASSES.filter(function (c) { return p < c.max; })[0] || CLASSES[CLASSES.length - 1];

      var before = null;
      for (var i = data.length - 1; i >= 0; i--) if (data[i].t <= last.t - 7 * 864e5) { before = data[i]; break; }
      var trend = "";
      if (before) {
        var dcm = Math.round((last.v - before.v) * 100);
        trend = Math.abs(dcm) <= 2 ? "→ stable" : (dcm > 0 ? "↗ en hausse (+" + dcm + " cm)" : "↘ en baisse (" + dcm + " cm)");
      }

      var bar = CLASSES.map(function (c) { return '<span style="background:' + c.col + '"></span>'; }).join("");
      var pinLeft = Math.max(2, Math.min(98, p * 100));

      $("mwh-nappe").innerHTML =
        '<div class="mwh-badge" style="background:' + cls.col + '"><div class="mwh-badge-ico">' + cls.ico + "</div><div>" +
        '<div class="mwh-badge-lbl">Criticité</div><div class="mwh-badge-val">' + info("nappe") + cls.crit + "</div></div></div>" +
        '<p class="mwh-msg">Niveau <b>' + cls.lbl.toLowerCase() + "</b> pour la saison : plus haut que " +
        Math.round(p * 100) + " % des " + refs.length + " années mesurées à la même période.</p>" +
        '<div class="mwh-gauge" role="img" aria-label="Position du niveau : ' + esc(cls.lbl) + '">' +
          '<div class="mwh-gauge-bar">' + bar + '</div><div class="mwh-gauge-pin" style="left:' + pinLeft + '%"></div>' +
          '<div class="mwh-gauge-legend"><span>Très bas</span><span>Normal</span><span>Très haut</span></div></div>' +
        '<dl class="mwh-kv">' +
          (last.prof != null ? "<dt>Eau à</dt><dd>" + num(last.prof, 2) + " m sous le sol</dd>" : "") +
          (trend ? "<dt>Sur 7 jours</dt><dd>" + trend + "</dd>" : "") +
          "<dt>Dernière mesure</dt><dd>" + dmy(lastD) + "</dd>" +
        "</dl>";
    }).catch(function () {
      fail("mwh-nappe", "Impossible de récupérer le niveau de la nappe pour le moment.",
        "https://ades.eaufrance.fr/Fiche/PtEau?Code=03103X0047/PZ");
    });
  }

  /* ------------------------------------------------------------------ */
  /* ------------------------------------------------------------------
     3) AULNE — hauteur d'eau à Châteaulin comparée aux mêmes dates depuis 2010
        (dernière hauteur mesurée vs hauteurs maximales journalières HIXnJ ;
         repli sur le débit moyen des 24 h vs débits moyens journaliers QmnJ si la hauteur manque)
     ------------------------------------------------------------------ */
  var CLASSES_RIV = [
    // Couleurs inversées : basses eaux en violet/bleu, hautes eaux (crue) en orange/rouge
    { max: 0.10, lbl: "Très basses eaux", crit: "Critique (étiage)", col: "#5b2a86", ico: "🟣", msg: "Rivière à un niveau exceptionnellement bas pour la saison." },
    { max: 0.25, lbl: "Basses eaux",      crit: "Préoccupant",       col: "#2f80c9", ico: "🔵", msg: "Niveau nettement inférieur à la normale de saison." },
    { max: 0.40, lbl: "Plutôt bas",       crit: "Vigilance",         col: "#1aa39a", ico: "🟢", msg: "Niveau un peu en dessous de la normale de saison." },
    { max: 0.60, lbl: "Normal",           crit: "Normal",            col: "#2e9e6a", ico: "🟢", msg: "Niveau habituel pour la saison." },
    { max: 0.75, lbl: "Plutôt haut",      crit: "Normal",            col: "#e0b100", ico: "🟡", msg: "Niveau un peu au-dessus de la normale de saison." },
    { max: 0.90, lbl: "Hautes eaux",      crit: "Vigilance",         col: "#e67e22", ico: "🟠", msg: "Rivière haute : restez attentifs aux bulletins de crue." },
    { max: 1.01, lbl: "Très hautes eaux", crit: "Critique (crue)",   col: "#c0392b", ico: "🔴", msg: "Niveau exceptionnellement haut : consultez Vigicrues." }
  ];

  // Valeurs journalières Hub'Eau (obs_elab) -> [{t, y, v}]
  function elab(r) {
    return (r.data || []).filter(function (x) { return x.resultat_obs_elab != null; }).map(function (x) {
      var p = x.date_obs_elab.split("-"); return { t: Date.UTC(+p[0], +p[1] - 1, +p[2]), y: +p[0], v: x.resultat_obs_elab };
    });
  }
  // Moyennes par année des valeurs des mêmes dates (± fenêtre), hors année en cours
  function refsSaison(hist, tRef) {
    var d = new Date(tRef), win = CFG.nappeFenetreJours * 864e5, byYear = {};
    hist.forEach(function (r) {
      var yr = null;
      [r.y - 1, r.y, r.y + 1].forEach(function (y) {
        if (Math.abs(r.t - Date.UTC(y, d.getUTCMonth(), d.getUTCDate())) <= win) yr = y;
      });
      if (yr == null || yr === d.getUTCFullYear()) return;
      (byYear[yr] = byYear[yr] || []).push(r.v);
    });
    return Object.keys(byYear).filter(function (y) { return byYear[y].length >= 5; }).map(function (y) {
      var a = byYear[y]; return a.reduce(function (s, x) { return s + x; }, 0) / a.length;
    });
  }
  function obs(r) {
    return (r.data || []).filter(function (x) { return x.resultat_obs != null; })
      .map(function (x) { return { t: new Date(x.date_obs).getTime(), v: x.resultat_obs }; })
      .sort(function (a, b) { return b.t - a.t; });
  }

  function loadAulne() {
    var base = "https://hubeau.eaufrance.fr/api/v2/hydrometrie/";
    var st = encodeURIComponent(CFG.stationAulne);
    var depuis = encodeURIComponent(new Date(Date.now() - 1.5 * 864e5).toISOString().slice(0, 19) + "Z");
    var vide = function () { return { data: [] }; };
    Promise.all([
      getJSON(base + "observations_tr?code_entite=" + st + "&grandeur_hydro=Q&date_debut_obs=" + depuis + "&size=1000&sort=desc&format=json").catch(vide),
      getJSON(base + "observations_tr?code_entite=" + st + "&grandeur_hydro=H&date_debut_obs=" + depuis + "&size=1000&sort=desc&format=json").catch(vide),
      getJSON(base + "obs_elab?code_entite=" + st + "&grandeur_hydro_elab=HIXnJ&fields=date_obs_elab,resultat_obs_elab&size=20000&format=json").catch(vide),
      getJSON(base + "obs_elab?code_entite=" + st + "&grandeur_hydro_elab=QmnJ&fields=date_obs_elab,resultat_obs_elab&size=20000&format=json").catch(vide)
    ]).then(function (res) {
      var q = obs(res[0]), h = obs(res[1]);
      if (!q.length && !h.length) throw new Error("pas de mesure récente");

      // Hauteur maximale des 24 dernières heures (mm) et débit moyen des 24 dernières heures (l/s)
      var hMax = h.length ? Math.max.apply(null, h.filter(function (r) { return r.t > h[0].t - 864e5; }).map(function (r) { return r.v; })) : null;
      var qDay = q.length ? q.filter(function (r) { return r.t > q[0].t - 864e5; }) : [];
      var qNow = qDay.length ? qDay.reduce(function (s, r) { return s + r.v; }, 0) / qDay.length : null;

      // Situation : selon la hauteur, sinon selon le débit
      // situation calculée sur la hauteur du moment (dernière mesure, toutes les 5 min)
      var refs = h.length ? refsSaison(elab(res[2]), h[0].t) : [], vNow = h.length ? h[0].v : null, surH = true;
      if (refs.length < 5) { refs = q.length ? refsSaison(elab(res[3]), q[0].t) : []; vNow = qNow; surH = false; }
      if (refs.length < 5 || vNow == null) throw new Error("historique insuffisant");
      var below = 0, eq = 0;
      refs.forEach(function (x) { if (x < vNow) below++; else if (x === vNow) eq++; });
      var p = (below + eq / 2) / refs.length;
      var cls = CLASSES_RIV.filter(function (c) { return p < c.max; })[0] || CLASSES_RIV[CLASSES_RIV.length - 1];
      var med = refs.slice().sort(function (a, b) { return a - b; })[Math.floor(refs.length / 2)];

      var m = function (mm) { return num(mm / 1000, 2) + " m"; };
      var m3 = function (ls) { return (ls >= 10000 ? num(ls / 1000, 0) : num(ls / 1000, 2)) + " m³/s"; };
      var quoi = surH ? "Hauteur actuelle" : "Débit des 24 dernières heures";
      var plus = surH ? "plus haute" : "plus fort", moins = surH ? "plus basse" : "plus faible";

      // Tendance de la hauteur : dernière mesure vs la plus proche de 24 h plus tôt (± 1 h)
      var trend = "";
      if (h.length) {
        var ref = null;
        h.forEach(function (r) { var d = Math.abs(r.t - (h[0].t - 864e5)); if (d <= 3600e3 && (!ref || d < ref.d)) ref = { r: r, d: d }; });
        if (ref) {
          var cm = Math.round((h[0].v - ref.r.v) / 10);
          trend = cm === 0 ? "→ stable" : (cm > 0 ? "↗ +" : "↘ −") + (cm === 0 ? "" : Math.abs(cm) + " cm");
        }
      }
      var lastT = new Date(h.length ? h[0].t : q[0].t);

      var bar = CLASSES_RIV.map(function (c) { return '<span style="background:' + c.col + '"></span>'; }).join("");
      $("mwh-aulne").innerHTML =
        '<div class="mwh-badge" style="background:' + cls.col + '"><div class="mwh-badge-ico">' + cls.ico + "</div><div>" +
        '<div class="mwh-badge-lbl">Criticité · ' + esc(cls.lbl) + '</div><div class="mwh-badge-val">' + info("aulne") + cls.crit + "</div></div></div>" +
        '<p class="mwh-msg">' + cls.msg + " " +
        (below === 0 ? quoi + " " + moins + " que toutes les " + refs.length + " années mesurées à la même période."
          : below === refs.length ? quoi + " " + plus + " que toutes les " + refs.length + " années mesurées à la même période."
          : quoi + " " + plus + " que " + Math.round(p * 100) + " % des " + refs.length + " années mesurées à la même période.") + "</p>" +
        '<div class="mwh-gauge" role="img" aria-label="Position ' + (surH ? "de la hauteur" : "du débit") + " : " + esc(cls.lbl) + '">' +
          '<div class="mwh-gauge-bar">' + bar + '</div><div class="mwh-gauge-pin" style="left:' + Math.max(2, Math.min(98, p * 100)) + '%"></div>' +
          '<div class="mwh-gauge-legend"><span>Étiage</span><span>Normal</span><span>Crue</span></div></div>' +
        '<dl class="mwh-kv">' +
          (h.length ? "<dt>Hauteur à l'échelle</dt><dd>" + m(h[0].v) + "</dd>" : "") +
          (surH ? "<dt>Normale de saison</dt><dd>≈ " + m(med) + "</dd><dt>Hauteur max. 24 h</dt><dd>" + m(hMax) + "</dd>"
                : "<dt>Débit (moy. 24 h)</dt><dd>" + m3(qNow) + "</dd><dt>Normale de saison</dt><dd>≈ " + m3(med) + "</dd>") +
          (trend ? "<dt>Hauteur sur 24 h</dt><dd>" + trend + "</dd>" : "") +
          (surH && q.length ? "<dt>Débit</dt><dd>" + m3(q[0].v) + "</dd>" : "") +
          "<dt>Dernière mesure</dt><dd>" + dmy(lastT) + " " + hm(lastT) + "</dd>" +
        "</dl>";
    }).catch(function () {
      fail("mwh-aulne", "Impossible de récupérer le niveau de l'Aulne pour le moment.",
        "https://www.hydro.eaufrance.fr/stationhydro/J382182001/fiche");
    });
  }

  /* ------------------------------------------------------------------
     Échelles de situation : icône ⓘ devant chaque situation, cadre par rubrique
     ------------------------------------------------------------------ */
  function info(cle) {
    return '<button type="button" class="mwh-info" data-echelle="' + cle + '" aria-label="Échelle de situation" title="Échelle de situation">ⓘ</button>';
  }
  function puce(txt, col) { return '<span class="mwh-ov-pill" style="background:' + col + '">' + txt + "</span>"; }
  function lignesRang(list) {
    var prev = 0;
    return list.map(function (c) {
      var hi = Math.round(c.max * 100), lo = Math.round(prev * 100); prev = c.max;
      return [puce(c.crit, c.col), lo === 0 ? "moins de " + hi + " %" : hi > 100 ? lo + " % et plus" : lo + " à " + hi + " %", c.lbl];
    });
  }
  var ECHELLES = {
    vigi: { titre: "Vigilance eau · Châteaulin",
      texte: "Niveau de restriction officiel en vigueur (arrêté préfectoral publié sur VigiEau). Le plus grave des zones s'applique : rivières, nappes, eau du robinet.",
      lignes: function () {
        var m = { vigilance: "économies d'eau conseillées", alerte: "premières restrictions d'usage",
          alerte_renforcee: "restrictions renforcées", crise: "usages limités aux besoins prioritaires" };
        return [[puce("Aucune restriction", "#2e9e6a"), "pas d'arrêté de restriction"]].concat(Object.keys(GRAV).map(function (k) {
          return [puce(GRAV[k].lbl, GRAV[k].col), m[k]];
        }));
      } },
    aulne: { titre: "Niveau de l'Aulne · Châteaulin",
      texte: "Hauteur d'eau du moment (dernière mesure, toutes les 5 minutes), comparée aux hauteurs maximales journalières des mêmes dates (± 10 jours) des années 2010 à 2025. Le pourcentage est la part des années où la hauteur était plus basse.",
      lignes: function () { return lignesRang(CLASSES_RIV); } },
    nappe: { titre: "Nappe · Saint-Ségal",
      texte: "Dernier niveau journalier de la nappe, comparé aux mêmes dates (± 10 jours) des années précédentes (depuis 2004). Le pourcentage est la part des années où le niveau était plus bas.",
      lignes: function () { return lignesRang(CLASSES); } }
  };
  var ouvert = null;   // { ov, btn }
  function fermer() {
    if (!ouvert) return;
    ouvert.ov.hidden = true; try { ouvert.btn.focus(); } catch (e) {} ouvert = null;
  }
  function ouvrir(btn) {
    var e = ECHELLES[btn.getAttribute("data-echelle")], carte = btn.closest(".mwh-card"); if (!e || !carte) return;
    fermer();
    var ov = carte.querySelector(".mwh-ov");
    if (!ov) { ov = document.createElement("div"); ov.className = "mwh-ov"; ov.setAttribute("role", "dialog"); carte.appendChild(ov); }
    ov.setAttribute("aria-label", "Échelle de situation : " + e.titre);
    ov.innerHTML = '<button type="button" class="mwh-ov-x" aria-label="Fermer">×</button><h4>' + e.titre + "</h4><p>" + e.texte + "</p><table>" +
      e.lignes().map(function (l) {
        return "<tr><td>" + l[0] + "</td><td>" + l[1] + "</td>" + (l[2] ? '<td class="mwh-ov-l">' + l[2] + "</td>" : "") + "</tr>";
      }).join("") + "</table>";
    ov.hidden = false; ov.scrollTop = 0; ouvert = { ov: ov, btn: btn };
    ov.querySelector(".mwh-ov-x").focus();
  }
  root.addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest(".mwh-info, .mwh-ov-x");
    if (!b) return;
    if (b.classList.contains("mwh-ov-x") || (ouvert && ouvert.btn === b)) { fermer(); return; }
    ouvrir(b);
  });
  root.addEventListener("keydown", function (ev) { if (ev.key === "Escape") fermer(); });

  /* ------------------------------------------------------------------ */
  function refreshAll() {
    loadVigieau(); loadNappe(); loadAulne();
    var d = new Date();
    $("mwh-updated").textContent = "Mis à jour le " + dmy(d) + " à " + hm(d);
  }
  refreshAll();
  setInterval(refreshAll, CFG.refreshMinutes * 60000);
})();
</script>
<script>
  // Signale la hauteur du widget à la page qui l'affiche (site antreizh.fr ou appli), pour ajuster le cadre
  (function () {
    if (window.parent === window) return;
    var last = 0;
    function envoyer() {
      var h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h && h !== last) { last = h; window.parent.postMessage({ hydraulneHauteur: h }, "*"); }
    }
    if (window.ResizeObserver) new ResizeObserver(envoyer).observe(document.body);
    window.addEventListener("load", envoyer);
    setTimeout(envoyer, 500); setTimeout(envoyer, 2000); setTimeout(envoyer, 5000);
  })();
</script>
</body>
