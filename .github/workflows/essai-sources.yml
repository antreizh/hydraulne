# Essai temporaire : vérifie quelles sources de données répondent depuis GitHub (sera supprimé).
name: Essai des sources
on:
  workflow_dispatch:
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Essai
        run: |
          python3 - <<'PY'
          import urllib.request, json, time
          UA = {"User-Agent": "hydraulne-archive (antreizh.fr)"}
          def lire(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120) as r: return r.read()
          R = "https://services.data.shom.fr/maregraphie/observation/json/3?sources={s}&dtStart={a}&dtEnd={b}"
          for s, a, b in [(1,"2026-11-05T00:00:00Z","2026-11-05T05:59:00Z"),(1,"2026-11-04T00:00:00Z","2026-11-04T23:59:00Z"),
                          (2,"2026-10-01T00:00:00Z","2026-10-10T23:59:00Z"),(1,"2026-09-30T00:00:00Z","2026-09-30T23:59:00Z"),
                          (1,"2026-11-06T00:00:00Z","2026-11-06T23:59:00Z"),(3,"2026-10-01T00:00:00Z","2026-10-01T23:59:00Z"),
                          (5,"2026-10-01T00:00:00Z","2026-10-01T23:59:00Z"),(6,"2026-10-01T00:00:00Z","2026-10-01T23:59:00Z")]:
              t0 = time.time()
              try:
                  d = json.loads(lire(R.format(s=s, a=a, b=b)))["data"]
                  print(f"REFMAR s{s} {a[:10]} : {len(d)} valeurs en {time.time()-t0:.0f} s", d[:1], d[-1:])
              except Exception as e:
                  print(f"REFMAR s{s} {a[:10]} : ÉCHEC après {time.time()-t0:.0f} s ({e})")
          for a, b in [("2026-09-30T00:00","2026-10-01T00:00"),("2026-11-06T00:00","2026-11-07T00:00")]:
              t0 = time.time()
              try:
                  d = json.loads(lire(f"https://www.ioc-sealevelmonitoring.org/service.php?query=data&code=bres&timestart={a}&timestop={b}&format=json"))
                  print(f"IOC {a[:10]} : {len(d)} valeurs en {time.time()-t0:.0f} s", d[:1], d[-1:], sorted(set(x['sensor'] for x in d)))
              except Exception as e:
                  print(f"IOC {a[:10]} : ÉCHEC après {time.time()-t0:.0f} s ({e})")
          PY
