# Essai temporaire : vérifie quelles sources de données répondent depuis GitHub (sera supprimé).
name: Essai des sources
on:
  workflow_dispatch:
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Essai
        run: |
          python3 - <<'PY'
          import re, urllib.request, gzip, csv, io, json
          UA = {"User-Agent": "hydraulne-archive (antreizh.fr)"}
          S3 = "https://meteofrance.s3.sbg.io.cloud.ovh.net"
          def lire(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=90) as r: return r.read()
          for pre in ["data/synchro_ftp/BASE/HOR/H_29_", "data/synchro_ftp/BASE/MIN/MN_29_", "data/synchro_ftp/BASE/MIN/"]:
              x = lire(f"{S3}/?list-type=2&prefix={pre}").decode()
              print("===", pre, re.findall(r"<Key>([^<]+)</Key><LastModified>([^<]+)", x)[-8:])
          x = lire(f"{S3}/?list-type=2&prefix=data/synchro_ftp/BASE/HOR/H_29_latest").decode()
          cles = re.findall(r"<Key>([^<]+)</Key>", x)
          print(cles)
          for k in cles:
              if "latest" in k:
                  t = gzip.decompress(lire(f"{S3}/{k}")).decode("utf-8", "replace")
                  L = list(csv.reader(io.StringIO(t), delimiter=";"))
                  tete = [h.strip() for h in L[0]]
                  print("ENTETE", tete)
                  b = [l for l in L if l and l[0].strip() == "29075001"]
                  print("Brest-Guipavas", len(b))
                  for l in b[-3:]:
                      print({tete[i]: l[i].strip() for i in range(len(tete)) if l[i].strip()})
          for d in ["2026-09-30", "2026-01-01", "2020-01-01"]:
              u = f"https://services.data.shom.fr/maregraphie/observation/json/3?sources=1&dtStart={d}T00:00:00Z&dtEnd={d}T23:59:00Z"
              j = json.loads(lire(u))["data"]; print("REFMAR", d, len(j), j[:1], j[-1:])
          u = "https://services.data.shom.fr/maregraphie/observation/json/3?sources=1&dtStart=2026-11-06T06:00:00Z&dtEnd=2026-11-06T23:59:00Z"
          j = json.loads(lire(u))["data"]; print("REFMAR aujourd'hui", len(j), j[-2:])
          PY
