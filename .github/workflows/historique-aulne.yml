# Branche analyse-aulne uniquement (sans lien avec main ni avec l'appli) :
# télécharge une fois l'historique hydrométrique de l'Aulne 2000-2025 (Hub'Eau + HydroPortail)
# et l'enregistre dans donnees/ sur cette même branche. Lancement manuel uniquement.
name: Historique Aulne

on:
  workflow_dispatch:   # lancement manuel uniquement (téléchargement déjà fait le 19/11/2026)

permissions:
  contents: write

concurrency:
  group: historique-aulne
  cancel-in-progress: true

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger l'historique
        run: |
          pip install --quiet pandas
          python3 scripts/telecharger_aulne.py donnees

      - name: Enregistrer les données sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/ || true
          git diff --cached --quiet && { echo "Rien à enregistrer"; exit 0; }
          git commit -m "Historique Aulne : données téléchargées ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:analyse-aulne
